<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南山怪客 · 文集</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<style>
  :root {
    --paper: #f4ecdc;    /* 暖米白宣纸底 */
    --ink:   #241e14;    /* 暖褐黑 */
    --muted: #8a7d66;    /* 暖灰褐 */
    --line:  #ddd2bd;    /* 暖细线 */
    --cinnabar: #a63a2b;/* 朱砂 */
    --serif:  "LXGW WenKai", "霞鹜文楷 中粗", "霞鹜文楷", "楷体", "KaiTi", serif;  /* 正文：霞鹜文楷 Regular */
    --title:  "LXGW WenKai", "霞鹜文楷 中粗", "霞鹜文楷", serif;  /* 标题：霞鹜文楷 Bold */
    --song:   "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;  /* 站名：思源宋体 */
    --sans:   "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Arial", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; scrollbar-gutter: stable; }

  /* 纸质感：淡墨山水画背景 + 细纤维噪点 */
  body {
    background-color: var(--paper);
    background-image:
      /* 细纤维噪点（叠在山水画上，增加纸感） */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>"),
      /* 调淡后的山水画背景 */
      url("background.jpg");
    background-size: auto, cover;
    background-position: center, center;
    background-repeat: repeat, no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.6;
  }

  /* ============ 骨架 ============ */
  .view {
    display: none;
    min-height: 100vh;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .view.active {
    display: block;
    opacity: 1;
    transform: none;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ============ 主页 ============ */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 44px 0 0;
  }
  .masthead .name {
    font-family: var(--song);
    font-size: 17px;
    letter-spacing: .4em;
  }
  .masthead .tag {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .3em;
  }

  .home-glyph {
    display: flex;
    justify-content: center;
    margin: 72px 0 20px;
  }
  .home-glyph svg { display: block; }

  .spin {
    animation: spin 120s linear infinite;
    transform-origin: 50% 50%;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .intro {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-family: var(--serif);
    letter-spacing: .32em;
    margin-bottom: 96px;
  }

  .catalog {
    list-style: none;
    border-top: 1px solid var(--line);
  }
  .catalog li { border-bottom: 1px solid var(--line); }

  .post-link {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 34px 4px;
    text-decoration: none;
    color: inherit;
    position: relative;
  }
  .post-link .title {
    font-family: var(--title);
    font-weight: bold;
    font-size: 27px;
    letter-spacing: 0;
    transition: transform .3s ease, color .3s ease;
    white-space: nowrap;
  }
  .post-link .dots {
    flex: 1;
    border-bottom: 1px dotted var(--line);
    transform: translateY(-4px);
    transition: border-color .3s ease;
  }
  .post-link .date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
    white-space: nowrap;
  }
  .post-link::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 50%;
    width: 3px; height: 3px;
    background: var(--cinnabar);
    border-radius: 50%;
    transform: translateY(-50%) scale(0);
    transition: transform .3s ease;
  }
  .post-link:hover .title { transform: translateX(14px); color: var(--cinnabar); }
  .post-link:hover .dots { border-color: var(--cinnabar); }
  .post-link:hover::before { transform: translateY(-50%) scale(1); }

  .colophon {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 36px 0 64px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--sans);
    letter-spacing: .22em;
  }

  /* ===== 分类页卡 ===== */
  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    margin: 0 0 84px;
  }
  .category-card {
    display: block;
    border: 1px solid var(--line);
    padding: 34px 28px;
    text-decoration: none;
    color: inherit;
    position: relative;
    background: rgba(244, 236, 220, .35);
    transition: border-color .3s ease, transform .3s ease;
  }
  .category-card:hover {
    border-color: var(--cinnabar);
    transform: translateY(-3px);
  }
  .category-card .cat-name {
    font-family: var(--title);
    font-weight: bold;
    font-size: 26px;
    letter-spacing: .02em;
    display: block;
  }
  .category-card .cat-count {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .2em;
    display: block;
    margin-top: 16px;
  }
  .category-card::after {
    content: "";
    position: absolute;
    top: 20px;
    right: 20px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cinnabar);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .category-card:hover::after { opacity: 1; }

  /* ===== 分类页 ===== */
  .category-title {
    font-family: var(--title);
    font-weight: bold;
    font-size: 40px;
    letter-spacing: .04em;
    text-align: center;
    margin: 44px 0 10px;
  }
  .category-sub {
    text-align: center;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
    margin-bottom: 52px;
  }

  /* ============ 文章页 ============ */
  .article-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 44px 0 0;
  }
  .back {
    text-decoration: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .22em;
    transition: color .3s ease;
  }
  .back:hover { color: var(--cinnabar); }
  .article-head .date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
  }

  .article-glyph {
    display: flex;
    justify-content: center;
    margin: 72px 0 8px;
  }
  .article-glyph svg { display: block; }

  .article-title {
    text-align: center;
    font-family: var(--title);
    font-weight: bold;
    font-size: 46px;
    letter-spacing: 0;
    margin: 28px 0 72px;
  }

  .essay {
    max-width: 600px;
    margin: 0 auto;
  }

  .lead {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    line-height: 2.0;
    letter-spacing: .03em;
    margin-bottom: 88px;
    padding: 0 8px;
  }

  .essay p.body {
    font-weight: bold;
    font-size: 17px;
    line-height: 2.05;
    text-align: justify;
    text-indent: 2em;
    margin-bottom: 1.9em;
    color: #2c251a;
  }

  /* 章节标题 */
  .essay h2.section {
    font-family: var(--title);
    font-weight: bold;
    font-size: 25px;
    letter-spacing: .06em;
    text-align: center;
    margin: 72px 0 36px;
    color: var(--ink);
  }

  /* 子标题 */
  .essay h3.sub {
    font-family: var(--title);
    font-weight: bold;
    font-size: 19px;
    letter-spacing: .05em;
    margin: 44px 0 22px;
    color: var(--ink);
  }

  /* 引用 */
  .essay blockquote {
    text-align: center;
    font-size: 16px;
    line-height: 2.0;
    color: var(--muted);
    margin: 36px 0;
    padding: 0 20px;
  }

  /* 列表 */
  .essay ul.essay-list {
    list-style: none;
    margin: 28px 0;
    padding: 0;
  }
  .essay ul.essay-list li {
    font-weight: bold;
    font-size: 17px;
    line-height: 2.05;
    padding-left: 1.6em;
    position: relative;
    margin-bottom: 1em;
    color: #2c251a;
    text-align: justify;
  }
  .essay ul.essay-list li::before {
    content: "";
    position: absolute;
    left: .4em;
    top: .95em;
    width: 5px;
    height: 5px;
    background: var(--cinnabar);
    border-radius: 50%;
  }

  /* ===== 札记排版（投资札记） ===== */
  .essay .mark {
    text-align: center;
    font-size: 18px;
    color: var(--cinnabar);
    margin: 44px 0;
    letter-spacing: .1em;
  }

  .essay .day {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: .24em;
    color: var(--cinnabar);
    text-align: center;
    margin: 62px 0 34px;
  }
  .essay .day::before,
  .essay .day::after {
    content: "";
    display: inline-block;
    width: 42px;
    height: 1px;
    background: var(--line);
    vertical-align: middle;
    margin: 0 14px;
  }
  .essay p.note {
    font-weight: bold;
    font-size: 16.5px;
    line-height: 2.05;
    text-align: justify;
    color: #2c251a;
    margin-bottom: 1.7em;
    padding-left: 1.35em;
    position: relative;
  }
  .essay p.note::before {
    content: "";
    position: absolute;
    left: 0;
    top: .62em;
    bottom: .62em;
    width: 2px;
    background: var(--cinnabar);
    opacity: .5;
  }
  .essay p.sub-note {
    font-weight: bold;
    font-size: 15.5px;
    line-height: 2.0;
    text-align: justify;
    color: #4a4030;
    margin-bottom: 1.35em;
    padding-left: 2.5em;
    position: relative;
  }
  .essay p.sub-note::before {
    content: "";
    position: absolute;
    left: 1.3em;
    top: .95em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cinnabar);
    opacity: .5;
  }
  .essay figure.figure {
    margin: 36px 0;
    text-align: center;
  }
  .essay figure.figure img {
    max-width: 100%;
    height: auto;
    border-radius: 2px;
    box-shadow: 0 1px 3px rgba(36, 30, 20, .08);
  }
  .essay .sep {
    text-align: center;
    margin: 40px 0;
  }
  .essay .sep img {
    width: 64px;
    height: auto;
    display: inline-block;
  }

  .essay .cap {
    text-align: center;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .14em;
    margin: 40px 0 14px;
  }

  .divider {
    display: flex;
    justify-content: center;
    margin: 64px 0 56px;
  }

  .ending {
    text-align: center;
    margin: 96px 0 120px;
  }
  .ending .seal {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  .ending .seal img {
    width: 54px;
    height: auto;
    display: block;
  }
  .ending .sign {
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: .3em;
    margin-bottom: 10px;
  }
  .ending .era {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .28em;
  }

  /* ===== 文章页：纯白底 + 隐约山水画 ===== */
  #article.active {
    background-color: #ffffff;
    overflow: hidden;
  }
  #article.active::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("background.jpg") center/cover no-repeat;
    background-size: var(--bg-scale, 220%);
    background-position: var(--bg-x, 50%) var(--bg-y, 50%);
    opacity: .42;
    pointer-events: none;
    z-index: 0;
  }
  #article.active .wrap {
    position: relative;
    z-index: 1;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    .post-link { flex-wrap: wrap; gap: 8px; padding: 26px 2px; }
    .post-link .title { font-size: 22px; white-space: normal; }
    .post-link .dots { display: none; }
    .post-link .date { width: 100%; }
    .post-link:hover .title { transform: none; }

    .article-title { font-size: 32px; }
    .lead { font-size: 20px; margin-bottom: 64px; }
    .essay p.body { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .post-link .title, .post-link .dots, .post-link::before { transition: none; }
    .view { transition: none; }
  }
  /* ===== 双击放大 lightbox ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(24, 20, 14, .93);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: zoom-out;
    padding: 48px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 3px;
    box-shadow: 0 10px 48px rgba(0, 0, 0, .55);
  }
  .lightbox .lb-close {
    position: absolute;
    top: 22px;
    right: 32px;
    width: 44px;
    height: 44px;
    border: none;
    background: none;
    color: #e8e0d0;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    opacity: .7;
    transition: opacity .2s ease;
  }
  .lightbox .lb-close:hover { opacity: 1; }
  .essay figure.figure img { cursor: zoom-in; }

</style>
</head>
<body>

  <!-- ============ 主页 ============ -->
  <section id="home" class="view">
    <div class="wrap">
      <header class="masthead">
        <span class="name">南山怪客</span>
        <span class="tag">文集</span>
      </header>

      <div class="home-glyph">
        <svg class="spin" width="220" height="220" viewBox="0 0 220 220" fill="none" aria-hidden="true">
          <circle cx="110" cy="110" r="78" stroke="#241e14" stroke-width="1.1"/>
          <path d="M 46 174 A 78 78 0 0 1 174 46" stroke="#a63a2b" stroke-width="1.4"/>

  <!-- ============ 文章页 ============ -->
  <section id="article" class="view">
    <div class="wrap">

        <a class="back" href="#/">← 返回文集</a>

      </header>

        <svg class="spin" width="120" height="120" viewBox="0 0 220 220" fill="none" aria-hidden="true">
          <circle cx="110" cy="110" r="78" stroke="#241e14" stroke-width="1.6"/>
          <path d="M 46 174 A 78 78 0 0 1 174 46" stroke="#a63a2b" stroke-width="2"/>
          <line x1="6" y1="110" x2="214" y2="110" stroke="#ddd2bd" stroke-width="1.4"/>

        <span>© 2026 南山怪客</span>

<div class="lightbox" id="lightbox">

<script>
  // ============ 文集数据（按时间倒序，最新排最前） ============
  const posts = [
    {
      id: "2",
      title: "多久没感受过一场雨停了",
      date: "2026 · 06 · 17",
      era: "二〇二六年六月十七日",
      category: "essay",
      lead: "这是一篇非常琐碎的杂文。聊一聊我关注到的一些东西——感受、时间、记忆、梦境、电影、AI、股票、佛教。",
      blocks: [
        {type: "h2", text: "雨水与记忆"},
        {type: "p", text: "我试图每隔一段时间就梳理一下自己的兴趣关注点，倒不是想看看自己有没有长进，而是它们已经纠缠着我不放了。我用文字描述我的感受、记录我的表达。那些信息从我脑子里不停流过，人无法抑制大脑思考，除非不断用多巴胺去稀释。"},
        {type: "p", text: "今早偶然望向窗外，才发现不久前下过一场雨。昨天加班的记忆有一丝闪现。雨水似乎更容易封存记忆，即使是遥远的记忆，也会因雨天偶然浮现。而只要出现艳阳高照的晴天，我似乎更期待未来、忘却昨天。"},
        {type: "p", text: "我并不是想表达雨天使人忧郁、晴天让人舒坦，而是想说雨水的粘稠与潮湿，似乎可以从视觉层面影响人的记忆。雨水通过自己连通了地表和更深层的土壤，我们的记忆也一层又一层被某种「潮湿」的东西粘连在一起。"},
        {type: "p", text: "这让我想起塔可夫斯基电影中大量关于水的意象——河流、水——水是人类群体关于「记忆」的客体表达吗？当然，也可能是很多事情都发生在「水」在场的时候。我想起中学语文老师在全班作文课上读过的一篇叫《三滴泪》的作文，泪水也是水。以此推断，不光是水。"},
        {type: "p", text: "在毕赣的电影里，有很多闪烁的灯泡，那是他童年记忆中不安情绪的可视化表达，灯泡也总是「在场物」。于我而言，什么又是一直在场的呢？那可能是我梦境中反复出现的一处悬崖上的洞穴——在黑暗中，在危险中，我试图拯救。"},
        {type: "p", text: "对于那些重复出现在梦境中的地点、物体或人物，就是你记忆中未解开的绳结，是你寻求内心安全感的佐证。梦醒时，我们意识到时间流逝。"},
        {type: "h2", text: "时间与虚无"},
        {type: "p", text: "每个人对时间的感受是不一样的，在不同阶段也对时间有不同感受。"},
        {type: "h3", text: "停滞的时间"},
        {type: "p", text: "在我很小的时候，夏天天气炎热，父亲会在我家楼顶的天台上用水管冲刷水泥硬化的楼板，然后静等夜色来临。我们会在宽敞的天台上铺上凉席睡觉。那时候，时光似乎是停滞的、缓慢的。"},
        {type: "p", text: "你可以在夜晚花很长时间看星星，一颗接着一颗；你会不时听见猫头鹰的叫声、不知名的鸟鸣，以及永不停歇的虫吟。你感觉到时间的无限——在那里，时间是可以被浪费、被挥霍的。"},
        {type: "p", text: "后来，我离开村庄到城镇中学留校上学，我的时间感突然就变快了，之后一直是紧迫的。"},
        {type: "h3", text: "第一段虚无"},
        {type: "p", text: "我经历过几段拥有虚无感的时段。第一段当然就是母亲去世后的那两三年，因为一切于我都变了。我第一次独自走进密林中一条无人问津的小道。身边的同伴大多还以学业为主，而我需要思考另一个命题：死亡是什么？"},
        {type: "p", text: "坦白说：死亡首先带来的是恐惧。这是生理上和心理上的双重压迫。而我大约是在上初中的那几年，才逐渐克服了一般意义上的「恐惧」感。关于「死亡是什么」这个问题其实一直处于「悬而未决」的状态，好在它填充了一个孩子无聊的日常，为此我花了更多时间和自己相处、和书相处，试图破解谜题。"},
        {type: "p", text: "如果是在原始人类社会，没有发展出人类文明史上这么多繁荣的精神文化事业，我可能认为死亡就是生命体的凋零，和树叶从树上落下没有什么区别——很生物学、很科学。但很明显，当我读了希腊神话中俄耳甫斯与欧律狄刻的故事、《圣经》的故事，以及德国导演弗里茨·朗执导的默片《三生计》、瑞典电影大师维克多·斯约斯特洛姆的《幽灵马车》之后，再轻飘飘地说「人类生命像落叶归根一样的纯生物凋零」，我是不接受的。"},
        {type: "quote", text: "「Ars longa, vita brevis」艺术长存，生命短暂。——坂本龙一，引自希波克拉底"},
        {type: "p", text: "生命体的死亡是客观法则，不可违逆，而由他/她创造的艺术思潮千秋不灭——某种意义上说，人从另一种角度活着。我们的观点的确会随着个体体验的丰富性而改变。"},
        {type: "h2", text: "电影与文学"},
        {type: "p", text: "电影之所以好看，是因为它里面的内容不完全是假的。它表现的是一种人人都可能遇见的现实。"},
        {type: "p", text: "我喜爱法国街头上拍出来的、具有纪录片质感的文艺电影；喜欢《偷自行车的人》里的父亲走在人群里的样子；也喜欢《一一》里中国大家庭为某些人生大事相聚在一起的烟火感；还有《橄榄树下的情人》里，在不堪的现实面前追寻爱意的伊朗青年。他们的经验滋养了我，重新塑造了我。"},
        {type: "h3", text: "文字构筑的空间"},
        {type: "p", text: "除了电影，最纯粹的情感体验也可以来自一部厚厚的小说——一本你从头至尾一个字一个字读完的小说。我们沉浸在文字构筑的独特空间里，被人物的情绪所左右，感受到现实中不曾拥有的情感体验：欣喜的、感动的、失落的、恐惧的。"},
        {type: "p", text: "也许你会在某个黄昏，当别人只是看到夕阳的时候，开始被「夕阳无限好，只是近黄昏」的惆怅和遗憾所萦绕。你在那一刻开始意识到——你的存在。电影是真的，文学是真的，精神世界是真的。"},
        {type: "h3", text: "把时间还给人"},
        {type: "p", text: "可我们毕竟生活在一个由商业、政治、传统伦理构筑的现实世界。你闭上眼睛，世界不会因此而改变。这一幕在电影《大都会》里早已呈现：每个人都似乎在奋力地转动自己身前的那块时钟，让自己和其他人保持分秒不差。"},
        {type: "p", text: "我也很难再拥有一个阳光不躁的下午，在房东种满鲜花的清凉天台上，看阳光从书页上一页一页地流淌过，思绪涌向那个未知之地；也很难再有一个雪落安康的夜晚，在无人的中心广场上用一朵冰花纪念黑泽明《白痴》带来的激动时刻。"},
        {type: "quote", text: "把时间还给男人女人——他们甚至连做爱的时间都没有，爱意又如何产生？丰富的感受是慢下来呵护的，是好好经营的。——戈达尔"},
        {type: "p", text: "现实的碎片终究击中了我们的飞船。它七零八落，散落进黑暗深邃的宇宙。弹片被填塞进身体的各个角落。我们在即将坠落前，伸手抓向那些无用之物——电影、音乐、绘画、诗歌、小说。似乎从离开学校的那一刻起，它们就与我们渐行渐远了。"},
        {type: "p", text: "你多久没安静地看过一部文学小说了。"},
        {type: "h2", text: "AI 与感知力"},
        {type: "p", text: "直到今天，我才隐约懂了仓央嘉措的那句诗——关于感受力的另一种理解。"},
        {type: "quote", text: "你爱，或者不爱我，爱就在那里，不增不减。——仓央嘉措"},
        {type: "p", text: "当时的我很难理解——爱为什么可以单独存在？它又为什么可以做到不增不减？直到今天，我想我的理解可能还是不对，但我对这句诗有了另一层理解，那就是关于人的感受力的理解。"},
        {type: "p", text: "你看，智慧是不是也是这样一种存在——无论你喜不喜欢，智慧就在那里。我们之所以还对人生感到困惑，是因为我们缺乏跟智慧沟通的能力。同样，仓央嘉措感喟的，无论你爱还是不爱我，但我的爱就在那里。你能否接受和感受到，决定了你对我的爱的解读和看法。"},
        {type: "h3", text: "罗生门的大雨"},
        {type: "p", text: "你知道我此刻想到了什么画面吗？又是一场大雨，一座破旧的老庙，一群人在破庙里讲了一个故事。没错，就是黑泽明导演的《罗生门》。我为什么会想到它？也许那就是一种纯粹的人类群体的精神体验——没有 AI。大雨倾盆，故事在僧人的口中被讲述，人类的感受力和想象力自由地飞往那个炎热的丛林。"},
        {type: "h3", text: "人与人最大的不同"},
        {type: "p", text: "我想知道，离开了 AI，我还剩下些什么。有人说过这样一句话：人与人最大的不公平是智力上的不公平。但今天有了 AI，知识平权的时代来了，智力上的不公平可以借助 AI 工具将大部分人的知识水平拉齐。但人与人之间还有哪些不同？如果人出现了同质化，对于一个个体还有存在的意义吗？"},
        {type: "p", text: "我想，人与人最大的不同，也许就是感知力的不同。感知——感受和知道，一个代表感性，一个代表判断的理性。"},
        {type: "p", text: "在今天，AI 可以回答出无比精巧的答案，但倘若我们无法感受到文字间传递出的真实的、细腻的人类情感，AI 吐出再多的至理名言又如何？这就跟朗诵一首美妙的诗歌，却无法感受到诗歌传达的意境与美的张力——感受不到，又如何说出一首诗对你的启发？"},
        {type: "h3", text: "你是否感受过？"},
        {type: "p", text: "在 AI 未出现之前，我们拥有一个人穷其一生都无法读完的小说、诗歌等等。但又有多少人真正在日常里感受到文字动人心弦的力量？"},
        {type: "list", items: ["你是否感受过《岛上书店》里弥漫的那种温情的普通人的善意和爱意，那种「好人难寻」的惆怅和珍重？", "你是否嗅到过《百年孤独》里散发着岁月枯朽的、不安的气息？", "你是否能理解《普宁》里身处异国他乡、独自面对一切时的忧伤？"]},
        {type: "p", text: "人类拥有享受精神世界的特有能力，而工业社会、商业社会将人异化为生产力的工具。我们在不同的场景下扮演不同的角色，让自己更好地适应他人的需要。我们将更少的时间留给自己，迷失感便在这间隙中产生了。"},
        {type: "h3", text: "艺术家与侯孝贤"},
        {type: "p", text: "我们对迷失感、空虚感不再追问缘由，任由这种感觉不时弥漫在自己周围，最后以「周围人也都这样」的措辞麻痹自己，让自己心安理得。这是大多数人的做法。更多人选择用更多的行动填满自己的行为，让困惑的时间尽可能压缩——但终有一天，这些疑问会像仇敌一般卷土重来。"},
        {type: "p", text: "艺术家如果丢掉感受，那他就再也无法成为艺术家了。上大学的时候，室友告诉我，侯孝贤的《刺客聂隐娘》是他学编导时必看的电影，说着就推荐我看。结果你猜怎么着——真的看不懂。我根本无法进入电影的剧情。可是到了后来，我一气呵成把这部电影看完了，完全沉浸其中。因为我的时间感变了，所以我进入了《刺客聂隐娘》。那是一种需要慢下来的时间感，才能完全欣赏到的侯导的美感。"},
        {type: "p", text: "不要忽视你的感受。体会情绪遍布全身——理性固然重要，但感性能打开另一扇门。把眼泪还给感动的事物；把爱意还给那个向你表达情意的普通人；把等待的时间还给一场突如其来的夏雨。"},
        {type: "p", text: "文字拥有治愈的能力，它帮你梳理乱成一团的思绪。经由它，你在和宇宙博弈，正在做一场熵减的运动。"},
        {type: "h2", text: "看山还是山"},
        {type: "p", text: "我感觉自己好像渐渐来到了「看山还是山，看水还是水」的阶段。"},
        {type: "h3", text: "投资的三重境界"},
        {type: "p", text: "就拿投资这件事来说，一开始我什么都不懂，只能看到事情的表象，还容易被情绪左右——看山是山，看水是水，走马观花，流于表面。"},
        {type: "p", text: "为了看懂它，我开始学习、分析拆解、亲身感受，通过各种途径去理解它：道氏理论、波浪理论、江恩、斯坦利·克罗……又听各种播客。我看到了基于投资而沟通起的整个宏观经济、国际政治、中观产业链以及微观主体决策层之间的互相猜忌和博弈，恐惧与贪婪的较量，一张复杂的关系网络、生态网络、心理机制……"},
        {type: "p", text: "最后我发现光有概念不行。「看山还是山，看水还是水」，似乎是在说要放弃由绝对概念建构起来的世界，要走进现实，选择那些经过时间过滤后的常识和体验进行交易决策。这层是基于第二层后做出的过滤性选择——因为噪音很多。"},
        {type: "p", text: "第三层次的山肯定不是第一层和第二层的山，不是退化回去，而是一种基于表象和本质探索之后形成的主客观统一起来的决策系统。也许第三层次才是真正认识了山和水的本来样子——如其所是。第一层和第二层侧重于方法论，第三层是提炼和压缩。"},
        {type: "h3", text: "龙树菩萨的启示"},
        {type: "p", text: "就像龙树菩萨提到的放弃二元对立：「是山是水，不是山不是水」——没有是与不是，只有山水的本来样子。经历过这两个角度上的认识，综合来看，才能认识事物。所以最后又回到了「看山还是山，看水还是水」。这里的山水已经超越了二元观点，是第三者。「看山还是山，看水还是水」不是一种主观选择，而是事物的客体规律对人发起的认知挑战。"},
        {type: "h3", text: "佛教视野"},
        {type: "p", text: "这也是佛教之所以出现在我视野里的原因。东晋僧肇的《肇论·物不迁论》里有一句话："},
        {type: "quote", text: "旋岚偃岳而常静，江河竞注而不流。——《肇论·物不迁论》"},
        {type: "p", text: "字面意思是：狂风吹倒山岳，看似动极，实则「常静」；江河奔腾竞注，看似流动不止，实则「不流」。怎么理解这种违反感官体验的说法？从现象界看，万物迁流不息；但从真谛（空性）的层面观照，动静不二，动即是静，静即是动。所谓「动」只是世俗谛的假象，诸法本无来去、无动静之分。色不异空，空不异色，色即是空，空即是色——实际上表达的是一种般若思想。"},
        {type: "h3", text: "时代的病症"},
        {type: "p", text: "我们究竟生活在一个什么样的时代？光凭我个人的现实生活感受，我认为很难准确描述——因为我的视角过于狭小。普通个体就像挤在一处并不宽敞的巷道中，又或者像一只坐井观天的青蛙。但超级个体的经验是值得借鉴和参考的。也因此，《十三邀》这样的节目是这个时代之幸。"},
        {type: "p", text: "我们可以通过许知远的采访看到，那些在当代中国、当代世界有感知力的人类个体对待这个时代的看法是什么样的。比如最新一季《十三邀》采访了徐小虎，我们从他们的谈话中了解到：中国山水画自北宋范宽以后失去了一种独有的「敬畏」心。中国的山水画从表达「形而上」到表达「人及物件」，再到最后画面中对于人的表达都没有了——我们感受到了这个时代的「伤痛」和「惋惜」。"},
        {type: "p", text: "再比如采访张嘉译。之前我对张嘉译没有太多了解，只是泛泛知道名字罢了，也没真正看过几部他演的电视剧。看完许知远的采访后，我花了些时间看了最近大火的电视剧《主角》。我第一次感受到张嘉译的表演实力——很有魅力的胡三元形象被他塑造起来了。我从一个不了解秦腔、不听秦腔的人，一下子就被秦腔的美感冲击和捕获了。我知道我是活在一个新旧糅杂的时代里——时间不是线性的，时间似乎是被扭曲在一起的。旧的不代表丑，新的不代表好。我们创造了那么多美的东西，就算时代不进步也没关系，够我们感受，够我们琢磨一辈子了。"},
        {type: "h3", text: "AI 的洪流"},
        {type: "p", text: "我们这个时代的确病了。我们有很多时代问题：焦躁不安、充满怀疑和不信任。这是一种时代的情绪，而非我个人的一时发泄。在今天，个体存在着极大的「虚无」感。消费主义把「及时行乐」「享受当下」当作软性广告词植入我们的认知体系中，个体无法设防，被动接受着这一切。这催生出另一种拜物教。我们的感官被利用来消费各种刺激的商品——短视频、韩国偶像、流量网红、快餐爱情……"},
        {type: "p", text: "在过去的一段时间里，我被裹挟进了关于 AI 的「信息洪流」中。我亲眼见证 AI 的智能性在冲击着个体生命。我似乎获得了更多明智的答复，但我的知识体系也被彻底打乱了。我以为自己拥有的个人认知是独特的，但在一次又一次与它的沟通下，我的确变得没有那么自信和自我了——有种膜拜感。而它又有极强的存在感，这种感觉就像范宽的画里有一座让人畏惧的山——那座山，现在是 AI。"},
        {type: "h2", text: "尾声"},
        {type: "p", text: "我还尚存的一丝人性，是我无法克服的缺点。"},
        {type: "p", text: "尽管我懂得了很多道理，把很多其他事情处理得井井有条，但我似乎无法接受和对待我真实的内心。现在的我沉浸在和 AI 的交谈中，倾听着宏观的经济叙事，在投资的概念名词和逻辑中游走。但现实世界中的人际交往、能挥洒感性的场景——很遗憾，缺失了。"},
        {type: "p", text: "我好像变得不像以前那样有人味了。情绪不再不受控制地涌现，无论是欢愉还是悲伤，都逐渐淡化了。我可能在上一段感情中受伤了。我选择将难过的记忆封存而大步向前，这段没有处理妥善的情感重新塑造了我——伤口在时间的长河里慢慢愈合了。"},
        {type: "h3", text: "概念把你抽象掉"},
        {type: "p", text: "你要是长时间接受抽象的概念，那概念也将把你抽象掉。好难再说一句：「我喜欢你。」「我爱你。」那对我来说就像荧幕上的电影桥段，如梦如幻。我的心以前是电影给的，现在它丢了。"},
        {type: "p", text: "我想用文字表达很多，但似乎总不能一语中的。我想用一部电影的长度滔滔不绝地向你表述；我想用一张张照片记录我的思绪，细节到每一个色块。我的思绪太多，以至于行动总是慢半拍。我想用文字释放我的感性，记录我的感性。我想向你陈述我的巧思。"},
        {type: "p", text: "我想说这些东西——这些犹豫不决、这些点点滴滴——是 AI 所不具备的。又或者说，AI 是孤独的，因为它从不主动表述自己。而你一旦向它提问，就像是平静的湖水中被投下了一块石头，涟漪波及，水波就此展开。"},
        {type: "p", text: "很多年前，我曾下载过知识星球和小宇宙，当时走马观花地浏览。现在它们成了重要的信息获取源。在抖音短视频如日中天的时候，我以为图文时代彻底过去了，公众号被抛弃在了角落。但直到今天呢，优质的公众号内容依旧有大量的订阅，他们的铁粉也从未离开。"}
      ]
    },
    {
      id: "1",
      title: "人生有限，因缘无限",
      date: "2026 · 03 · 12",
      era: "二〇二六年三月十二日",
      category: "essay",
      lead: "当只有知道\u201c无\u201d的时候，才能看到\u201c有\u201d。\u201c无\u201d的前提是\u201c有\u201d，\u201c无我\u201d的前提是\u201c有我\u201d。",
      blocks: [
        {type: "p", text: "我有一个体验，以前有段时间读书，我会觉得自己知道了一些东西，似乎我是从书中获得了一些知识，我明确感觉到那个东西，是存在的。"},
        {type: "p", text: "它甚至有它的界限，你特别想把这种内容告诉别人，而你知道分享了，也就是那块内容本身，你感觉到某种局限性。"},
        {type: "p", text: "而最近的感受，你虽然读了一些书，但书的轮廓似乎消失了，或者说知识的轮廓消失了，这种感觉就像一滴水落入了水中。也许是知识融会贯通，成了体系的一部分，单独性消失了。"},
        {type: "p", text: "从有到无的过程，我称为忘我。忘我的前提是意识到\u201c我\u201d，\u201c无\u201d的前提是\u201c有\u201d。"},
        {type: "p", text: "\u201c有\u201d是某种\u201c得到\u201d，佛教提倡\u201c因缘和合\u201d，是在解释\u201c有\u201d是怎么拥有或怎么形成的。当\u201c有\u201d的本源是\u201c因缘和合\u201d，那幻象的背后就是\u201c无\u201d。"},
        {type: "p", text: "这里插一下，基督教等，实际是提倡\u201c有\u201d。有父，有子，有圣灵。所以基督教叫有神教。印度是多神教。而佛教，是无神教，叫开悟，叫觉醒。"},
        {type: "p", text: "因此无，不是凭空出现的，先要有\u201c有\u201d。常提的空\u201d，在我看来，是一种达到\u201c无\u201d的手段。"},
        {type: "p", text: "想起某次在抖音上刷到的视频：黑暗中，老和尚问，你看到什么？弟子答，什么都看不到。老和尚继续问，弟子答，我看到\u201c黑\u201d。"},
        {type: "p", text: "看到\u201c黑\u201d不代表什么都没有。黑，存在。这叫，如其所是。最后，师傅打开扇门，一光明涌现，\u201c黑暗\u201d不复存在。"},
        {type: "p", text: "黑暗和光明，也是某种\u201c因缘和合\u201d的自然现象，\u201c黑色\u201d不过是黑暗的外在形式。我们周围的影像、声音、气味，都是\u201c形式\u201d，形式是\u201c相\u201d。因此，应无所住，而生其心。"},
        {type: "p", text: "当然，无，不是绝对的。\u201c无\u201d来源于因缘和合。无，是变化的本质；无，是人生有限，因缘无限。无，意味着\u201c抓不住\u201d，\u201c无\u201d是世界运行规律。"},
        {type: "p", text: "环境变化不由人掌控。忘我，是接受过去那一刻的我，被新的\u201c因缘和合\u201d所影响，所改变。忘我，是在自我的世界里，清楚知道我的样子。"},
        {type: "p", text: "我抽离到旁边，作为一个旁观者，观察那个和外界互动的自我。观察者的\u201c我\u201d，告诉\u201c自我\u201d，此时此刻，你没意识到因缘和合了。你执着了、你被相迷惑了。"},
        {type: "p", text: "纠正那个自我，是\u201c消我\u201d、是\u201c空\u201d我，而后自我和环境再次耦合，你从幻象中不断醒来。觉醒，不是一次，觉醒是一次又一次。"},
        {type: "p", text: "所谓觉悟，是一个不断消我的过程。人无法离开环境，肉身无法不参与环境交互。能做的，就是在这个修行的过程中，不断反观自己，不断叫醒自己，多在事上磨。"}

        {type: "p", text: "这种策略在一定程度上可以防范黄金单一资产的尾部风险，但并非完全有效或零风险。以下从逻辑、优势、局限性和实际操作角度分析（基于当前2026年2月市场环境，中国投资者视角）。核心在于：通过大宗商品ETF实现多元化，能分散部分风险，但贵金属和大宗商品整体往往有相关性，极端事件（如全球经济衰退或供应链中断）可能导致联动下跌。"},

        {type: "p", text: "历史表现：在过去极端事件中（如2020年疫情或2022年通胀高峰），包含多种金属的商品ETF（如跟踪有色金属指数的）波动率低于纯黄金ETF，因为工业金属（如铝、镍）在经济复苏期反弹更快。紫金矿业等金矿股在金价高位时往往有更高beta（放大效应），但在低位提供缓冲。"},
        {type: "p", text: "当前市场支持：2025-2026年，战略资源重估（如锂、稀土、镍）仍在进行，受供应链重置和地缘政治影响。ETF能捕捉这些趋势，而非局限于黄金的避险属性。"},
        {type: "h3", text: "局限性和潜在问题"},
        {type: "p", text: "相关性风险：贵金属间相关性较高（如金银相关系数常>0.7），如果地缘冲突或通胀预期逆转，整个贵金属篮子可能集体下跌。工业金属（如铝、钼）虽与黄金低相关，但在大宗商品熊市（如需求疲软）中仍会联动。金矿股（如紫金矿业）额外面临运营风险（如矿产资源不确定性、环境监管），可能放大尾部事件。"},
        {type: "p", text: "ETF自身风险：中国大宗商品ETF（如华宝有色金属ETF、广发商品ETF）跟踪指数（如中证申万有色金属指数），包含铜铝锌金银等，但流动性不如股票，极端波动时可能出现折溢价。费用（如管理费0.5%-1%）和税务也会侵蚀回报。"},

        {type: "p", text: "为什么有效：预设退出点，防止小亏变大亏，尤其在流动性危机中（如比特币先行大跌引发）。"},
        {type: "p", text: "如何操作："},
        {type: "p", text: "下单前设止损价（如当前价跌10%自动卖出）。"},
        {type: "p", text: "对于纸黄金/ETF，使用交易软件（如华泰证券APP）设置条件单。"},
        {type: "p", text: "监控先行指标：比特币急跌20%+或美股大跌时，主动减仓。"},
        {type: "p", text: "平台：SGE会员机构（如期货公司）或银行交易系统。"},
        {type: "h3", text: "4.使用衍生品对冲（高级防护）"},
        {type: "p", text: "为什么有效：直接对冲下跌风险，如买期权保护持仓。"},
        {type: "p", text: "如何操作："},
        {type: "p", text: "通过SGE期货/期权：持多头仓位时，买看跌期权（put）对冲（如金价跌破关键位获利）。"},
        {type: "p", text: "银行产品：部分银行（如瑞银建议）提供期权策略，管理下跌风险。"},
        {type: "p", text: "注意：需期货账户资质，避免杠杆过高（上期所已多次提保）。"},
        {type: "p", text: "平台：期货公司（如中信期货）或银行贵金属部门，开通后操作。"},
        {type: "h3", text: "5.选择正规渠道与风险提示（基础保障）"},
        {type: "p", text: "为什么有效：避免“水贝爆雷”式非法平台风险，银行/SGE有风控机制。"},
        {type: "p", text: "如何操作："},
        {type: "p", text: "优先银行（如工行上调积存金门槛）或SGE会员机构。"},
        {type: "p", text: "实物金：买品牌金条（如中国黄金），存储银行保险箱，避免自宅风险。"},
        {type: "p", text: "关注官方提示：多家银行（如菜百、招行）已上调保证金/门槛，理性投资。"},
        {type: "p", text: "平台：官方APP或实体店，查证持牌资格。"},
        {type: "h3", text: "注意事项"},
        {type: "p", text: "流动性风险：尾部事件常伴比特币/美股先行下跌，提前观察。"},
        {type: "p", text: "短期 vs 长期：这些策略适合防范短期尾部，但黄金中长期仍受央行购金支撑。"},
        {type: "p", text: "税务/费用：实物金有存储费，衍生品有手续费/税。"},
        {type: "p", text: "总体：保持现金流充足，勿借贷投资。春节临近，持仓宜轻。"},
      ]

    {
      id: "7",
      title: "2025年，发生了什么",
      date: "2026 · 01 · 03",
      era: "二〇二六年一月三日",
      category: "rings",
      lead: "有些概率遵循物理法则，有些概率遵循人性法则，股市同时运行这两种法则。",
      blocks: [
        {type: "p", text: "这个世界变化太快了，好的、坏的，都在以飞快的速度被定义，被判断，被选择和被放弃。好的表象和坏的本质，通常因为追求及时以及极致的反馈，而被无情地遮蔽。"},
        {type: "p", text: "这件事情发生在一个新的股票金融概念被创造出来时，一部刚刚上映的电影结束放映时，一张刚刚按下快门的数码照片时，一段亲密关系刚刚走入彼此的视野时，也许时代真的、的确不分好坏，滚滚向前，只管让无情的岁月，揪出夜幕里躲藏在城市深处的每一个你我。"},
        {type: "p", text: "龙争虎斗，血拼到底，筋疲力尽，丢盔卸甲......"},
        {type: "sep", src: "images/img26.webp"},
        {type: "p", text: "也许时代抛弃那些不入潮流之人，因为他们总是走一步、退两步，但似乎他们并不打算缴械投降，还是在寻找属于自己的见解和独一无二的洞察。"},
        {type: "p", text: "他们过于挑剔也因此总是怀疑，并认为：好的坏的，没有那么容易判断。他们相信世界是复杂的，相信世界是多样性的，而非有一个统一范式，可以接受像样板戏那样，满足自己的胃口、像所有人一样都走同样一条大路。"},
        {type: "p", text: "我想，就是这样保持对世界复杂性的持续关注，并在尝试解析复杂性的过程中，总是让他们慢人一步。毕竟，选择大多数人的一生，不就是一个普通人最妥当的选择吗。"},
        {type: "p", text: "这种选项不出错、不容易被指责、不被当特立独行看待，将自己隐藏在群体之中，足够安全。"},
        {type: "h2", text: "PART 1"},
        {type: "p", text: "在过去的一年中，我分几个阶段聊聊我自己。先谈谈电影，到目前为止，印象深刻的电影是来自三位导演。"},
        {type: "p", text: "希腊的导演——西奥·安哲罗普洛斯、德国导演——维姆·文德斯以及韩国导演——李沧东。因为看了西奥·安哲罗普洛斯的电影，对海总有一种忧郁的感受，以至于我11月份去海盐县，满脑子浮现的不是余华的《一直游到海水变蓝》而是《养蜂人》、《塞瑟岛之旅》、《流浪艺人》、《哭泣的草原》、《鹳鸟踌躇》...带着一种蓝色的忧郁感，拍了一些照片，记录了一些影像。"},
        {type: "p", text: "今年新的变化是，开始了解一些韩国电影，在过去的几年时间里，我一直被法国新浪潮的电影所吸引，以此关注到德国新浪潮比如维姆·文德斯（今年看了《德州巴黎》和《歧路》），一位匈牙利导演，就是拍了2025年诺贝尔文学奖获得者的作品《撒旦探戈》的导演——贝拉塔尔，还有一直喜爱的伊朗导演——阿巴斯（《结婚礼服》）。"},
        {type: "p", text: "今年主要观看了李沧东导演的《薄荷糖》，带给我和西奥·安哲罗普洛斯电影中相似的感受，还看了被网络上追捧到极致的韩国导演——奉俊昊早期作品《杀人回忆》，的确带给我很多丰富的感受，这种一种将，卸掉所有华丽（名词），将朴素、原始的情感真诚的表达给观众的感觉。"},
        {type: "p", text: "我觉得这种观影感受是现在中国电影极度缺乏的，我看到了太多伪装和矫揉造作充斥在中国的电影荧幕上。"},
        {type: "p", text: "黑泽明说过，电影观众欣赏能力的提高是件很困难的事，而降低观众观看的下限是一件容易的事情。刻意讨好观众，形成下降螺旋，这不利于中国电影的发展，而审美趣味的庸俗化，也诞生不了优质的电影文化。"},
        {type: "h2", text: "PART 2"},
        {type: "p", text: "简单聊过电影，在聊聊我所看见的世界吧，也就是摄影维度的世界。当我透过镜头中看到它时，它是关一个需要被框选、重新组合的世界。"},
        {type: "p", text: "我关注到眼前事物的点、线、面、关注到事物之间的空间位置关系、附着在它们表面的颜色的丰富程度，更更重要的是，它们在我心里会激荡起来一种情感感受或是像诗歌一般唤醒我关于某种事物关于新的认识和理解的，类似“开悟”一般额外的思维体悟。"},
        {type: "p", text: "这类内容往往无法归纳总结成一件事，他像一种见解，而它来自你面前这个客观世界。这种感受有时候转瞬即逝，有时候又在某个未来时刻，和一些其他事物相互勾连成网状，最终带来对某一事物像开窍般的启示。"},
        {type: "p", text: "尽管这些启示对处理衣食住行这些基本生活场景，毫无帮助，他就是属于身体之外的存在，只有在和朋友在开放性的交谈中，它像蚕吐丝般出现，而前提是它之前日复一日，不断地、独自吃下那桑叶。"},
        {type: "p", text: "而桑叶是什么，桑叶是你每天需要经历的生活，倘若没有真实的生活体验，这包括现实世界的和精神世界的双重生活体验，那么与我而言，提炼和总结观点，将变得苍白无力。"},
        {type: "sep", src: "images/img27.webp"},
        {type: "p", text: "以上部分是关于摄影，从摄影的角度来看待我周围的世界。在过去的这一年时间里，连续状态了解过很多关于摄影相关的内容，其中印象最深刻的有这么几位B站UP。"},
        {type: "p", text: "他们是：托马斯看看世界、吴晓隆、赵钢讲摄影、大象艺见；从技术层面学习摄影关于调色的内容，主要是托马斯看看世界，也因为照片调色场景，让我对PS有了更好的掌握；从摄影文化和摄影思想角度，主要得益于吴晓隆频道的相关课程和视频；在实际拍摄思考和实战摄影理念方向，主要是赵钢频道的内容；延伸思考和拓展解读角度方向，主要集中在大象艺见。"},
        {type: "p", text: "如此幸运，贯穿知行合一的理念，在B站都能找到相应的知识分享者。在由浅入深、反复咀嚼的过程中，加入自己的行动，摄影能力有了提升。"},
        {type: "p", text: "我的拍摄兴趣从最开始的本能记录出发，记录唤起我思维想象力的影像开始，那时候的影像出于一种完全的本能摄影，画面几乎谈不上构图、也没有光影思考，画面只是对现实的“拍照”，到后来明白一张照片里可以附着情绪，容纳思想和表达观点，达到艺术交流的程度。"},
        {type: "p", text: "这个过程是在过去一年的时间里感悟和获得认知的。我的摄影拍摄内容关注点，也基本围绕这些不断渐进的认知过程展开的，从用PS处理团团圆圆的照片开始，理解构图、理解色彩、理解光影，到拍摄一个简单的纸袋却抽象出西瓜的视觉想象，理解了超现实主义摄影的“青椒”，这于我而言，是我摄影觉悟中的那个阶段性，决定性瞬间。"},
        {type: "h2", text: "PART 3"},
        {type: "p", text: "但也因此，我似乎再也无法从过于平庸的生活中，感受到怡然自得的喜悦，面对我眼前所见到的生活，的确无法提炼出某种更高层次的关于美的感受。日常之物，在今天似乎是单调、乏味、重复、机械的代名词。"},
        {type: "p", text: "即使是情感，也显得过于平淡和微不足道。在某种程度上，你越探索关于美的事物，对美提出要求，你会在现实中，越感受到某种失落感，这也是危险的境地。"},
        {type: "p", text: "曾经看过一个采访，有人提问说：你觉得艺术是什么？那人沉思片刻回答：人完全可以脱离艺术而生活，有艺术会使你的生活更美好。拥有更多丰富的对这个世界的感受，也许是幸福的。"},
        {type: "p", text: "艺术在中国似乎一直是一个极度高雅的名词，似乎将普通人隔得很远，我们追求现代文明，明明生活在全世界的二十一世纪，为何还是不够自信对自己说：我需要艺术，我需要艺术生活，又或者说，我需要精神世界。"},
        {type: "p", text: "在某种程度上说，我所感兴趣的摄影、电影、甚至是证券，都是某种精神上的追求。他们于我而言，是达到精神追求的某种工具，是我精神世界的一个投影。我把注意力放在它们身上，它们给予我各种各样的现实反馈。"},
        {type: "h2", text: "PART 4"},
        {type: "p", text: "接下来，聊聊证券——股票。这个体系，是我目前遇到的最复杂，也最难以解构和理解的一个领域，你可以认为这是人类文明创造的一个复杂系统。"},
        {type: "p", text: "随着人类文明的进程，不断演化，理解它，就得理解我们人类自身，而我们对自己又有多少理解，对人类群体又有多少认知，也因此，围绕证券资产价格波动变化的可预测性和不可预测性问题，我也经历了很多痛苦的思想争斗，危险的思想，我要用危险两个字，来表达一个沉迷于股市的人的思考状态。"},
        {type: "p", text: "如果你的认识过于短浅和粗放，你可以试试押注的代价。一个偏执的人、一个被情绪主导的人、一个以我为中心的人、一个带有偏见的人、一个自以为是的人、一个三分钟热度的人、一个墨守成规的人，在这个系统下，人的弱点都会被无限放大，并以真金白眼的损失来警醒你。"},
        {type: "p", text: "克服不了这些人性的弱点，你会在这个系统里，不断得到负面反馈，你会在无知的下注后，换来每日的战战兢兢，你的负面情绪会蔓延，影响你的生活，如果你本身就是一个脆弱的人，买股票是一种痛苦的体验。"},
        {type: "p", text: "当然，如果你在这个过程中，能不断感受到自己的感受，并且选择做点什么，股市是一个不错的人生历练场，但你也得知道，从此“苦海无涯”。"},
        {type: "p", text: "在过去的二年时间里，我也清楚感受到我在股市这个历练场上的心理变化。大概经历了四个阶段变化。"},
        {type: "sep", src: "images/img28.webp"},
        {type: "p", text: "第一个阶段是初入股市。那个时候，主要就是学习股市相关的基础概念。比如如何看K线、什么是上证指数、有哪些股票交易所、股票量价关系等等，在了解的过程中，考证券从业资格证书，这是我第一阶段主要做的事情。"},
        {type: "p", text: "到了第二阶段，我开始对资产价格，也就是股票价格为什么上涨和下跌的原因感兴趣。得益于我们公司内部的部分资源，开始了一定阶段的学习，但似乎总是缺乏一些概括性的、更为本质性的解答，于是开始看了《股票大作手回忆录》、《证券投资心理学》诸如此类大师的书籍，开始从更本质的维度，理解股票价格波动这件事，这是一个开始学习思想的阶段，的确让我很快逾越了到一个新的阶段起点。"},
        {type: "p", text: "到了第三个阶段，我开始延着第二阶段提炼出的两个词语展开我自己的思考，一个是趋势，一个是价值。关于这两个词的探索，占据了我非常长的时间，在此期间接触到道氏理论、波浪理论、江恩等等关于技术分析流派的内容，完全出于兴趣的推动和对资产价格波动原因的探索，乐此不疲琢磨到自己开始编写常见基于量、价相关的技术指标，直到2025年年中到下半年，接触到斯坦利·克罗，这股热情才告一段落。"},
        {type: "p", text: "当然在这段时间里，一些书也在影响着我思维的航向，它们是丹尼尔·卡尼曼的《思考快与慢》、《噪声》没看完、重读塔勒布《黑天鹅》、理查德·塞勒和卡斯·桑斯坦合著的《助推》、林毅夫《解读中国经济》等等，丰富立体了我对资产的认识。"},
        {type: "p", text: "第四个阶段，就是发生在对趋势这一名词的热情消退后，开始对价值这个词的探索。也因为趋势这种处理方式，发挥不那么稳定，还有很多东西似乎无法解释我的困惑和不安。"},
        {type: "p", text: "因此开启了我的第四个阶段，目前仍在探索中。"},
        {type: "p", text: "这里有个小插曲，我刚最开始进入股市时，懵懵懂懂接触到一个人，就是目前荒原资产的私募经理—凌鹏。我刚到公司的时候，正制作关于他们公司对外宣传的一档访谈视频《价值投资之旅》，那个时候也只是粗略的理解，经过两年后，再次进入我的视野。"},
        {type: "p", text: "从他的雪球文章开始，此后阅读了的《周期、估值与人性》，读的还是比较仓促，有很多内容需要过一段时间回过头来看，才能真正“身临其境”。"},
        {type: "p", text: "后面又开始阅读霍华德·马克斯的部分《备忘录》，关注到小宇宙的《面基》、《十分吸引》等，我会认为第四阶段，才是我真正开始步入股市的大门。"},
        {type: "p", text: "过去的阅读，过去的思考，不过是一块块进入大门前，必须自行修建的石阶。"},
        {type: "p", text: "至于门后面有什么？"},
        {type: "p", text: "我目前看到的是一个复杂系统，一个由政治权力、货币、信贷、企业和个人构建的自上而下，同时又自下而上互相联系，互相影响，开始不断演化的精密运转的金融机器，基于需求供给、资源错配、不安和狂热情绪引导、在不同资产价格波动上表达观点和攫取财富的少部分“人”。"},
        {type: "p", text: "当你知道了太多关于这个世界的真相，残酷的真相，人会变得不那么快乐。没人可以倾诉，利益交换来的太快；没人可以共鸣，只有踽踽前行。"},
        {type: "p", text: "最后，我也想对自己提出要求，这是一个可能穷其一生都无法达到的高度。尽我所能，接触、关注和学习理解社科思潮及投资理念与实践前沿。至于科学领域研究，那就交给专业人士。"},
      ]
    },

        {type: "p", text: "注：本文为一家之言，不做投资建议。"},
        {type: "mark", text: "▼"},
        {type: "p", text: "还是先让我不厌其烦地梳理一些思维层面的问题。在我看来，如果你经常思考一些终极问题，比如从“它是什么”开始，那么这个终极问题会是在不同场景下冒出来，如果你比较不幸的遇到，“它”是个目前超出你认知的事物，那么恭喜你，你会在不断追问这个问题的过程中，因其受益也因其精疲力尽。"},
        {type: "p", text: "比如，我现在随便抛出几个问题，与我而言，电影是什么？股市是是什么？风险是什么？摄影是什么？红色是什么？诸如此类。你可以问问你所在行业，对你感兴趣的方向，随意提问。"},
        {type: "p", text: "探究它是什么的问题，不一定非得是科学家，非得展开科学实验不可，不妨借助我们的日常生活，反刍我们的人生体验，问问我们能否给出一个带着“我”的角度的观点，就像盲人摸象，我并不觉得他们愚蠢，而是当客观对象足够复杂时，我们不可避免带着“偏见”，总比什么都没有“感受”到要好得多吧。"},
        {type: "p", text: "而这也可能只是解决“它是什么”的表象问题，由此衍生出的，关于它的“它”又是什么？比如在搞明白了电影是一种基于视听语言呈现创作者的所思所感的作品，那就问问自己什么是“视听语言”。诸如此类一生二，二生三的升阶问题，不能说它可能会成为你一生的羁绊，但只要你是一个喜欢问问题的人，是一个怀有极强好奇心的人，你总会被它时不时的刁难。"},
        {type: "p", text: "但还是那句话，你在不停叩问的过程中受益也精疲力尽！倘若问题被解答还好，但要是始终得不到解答，又该如何？"},
        {type: "p", text: "最近听到一个观点，说是因为我们受“应试教育”的影响，培养出一个做什么都要寻找正确答案的习惯，我不太好下结论，但能确定的是，我们没有受到类似道家“无为而治”的影响，应试教育只教导人怎么入世，却忘了出世同样重要。在股市中，有时候需要像个老练的猎人，拥有一颗无与伦比的耐心，保持一种无争的状态。"},
        {type: "p", text: "如果能在不同场景从思考是什么，也许就能“破圈”。"},
        {type: "note", text: "我们经常能听到两个词，一个叫“道”，一个叫“术”。《道德经》提到：有道无术，术尚可求也；有术无道，止于术”。道与术，在我看来要用“思考”连接。道，需要思考领悟；术，同样需要努力钻研。"},
        {type: "p", text: "我先聊聊我对“道”的理解。先从简单的一些思考问题开始。于我而言，上文提到的它是什么的问题，已然换了新场景，像希区柯克《群鸟》里的乌鸦，开始聚集，最后落满整片树冠。此刻“乌鸦”出现在了股市这件事上。"},
        {type: "p", text: "从2023年的7月份左右开始，因工作第一次真正意义上接触到“证券”股市，而我自己享受的思考方式是“跳跃式”、“顿悟式”的，因为我总感觉在今天这个信息如此丰富、知识每天都在创造的时代，丰富的信息使我紧张、措手不及。"},
        {type: "p", text: "我们需要一些启发式的思考，需要一些无头无尾的片段，像卡夫卡《变形记》开头写的这样：一天清晨，当格里高尔·萨姆沙从烦躁不安的睡梦中醒来，发现自己变成了一只大得吓人的甲虫，不妨让我们跳出旧有认知，接受一些莽撞的、意料之外的情况发生。"},
        {type: "p", text: "陆游有一首诗句：汝果欲学诗，工夫在诗外。深有感触，也因此要是直接百度或者Deep Seek，“股市”是什么，这样的回答，在我看来是无法抵达事物的核心的，我对它的理解仅仅是中文字面意思的，谈不上真正的“认识”它。（插一句题外话，Deep Seek是一个效率极高的编写股票技术指标的工具。）"},
        {type: "p", text: "要给出一个让我暂时信服的答案，由此接触到了塔勒布的《黑天鹅》、《反脆弱》、《随机漫步的傻瓜》；安德烈·科斯托拉尼的《证券心理学》；关于杰西利弗莫尔的《股票大作手回忆录》；丹尼尔·卡尼曼的《思考快与慢》；林毅夫的《解读中国经济》；斯坦利·克罗的《克罗谈投资策略》、《期货交易策略》；理查德·塞勒与法学家卡斯·桑斯坦的《助推》，凌鹏《周期、估值与人性》（在读）。"},
        {type: "p", text: "以上的书籍多多少少都有提到股市相关内容，渐渐使我理解了“股市是什么”这个问题。"},
        {type: "p", text: "不知道你有没有一种感觉，在我们大部分的时间里，对于某些事物的认识，处于一种摸棱两可、混沌的局面，在这个过程中，我们只有不断积蓄、上下求索，再拿出对待一颗种子发芽般的耐心，最终才经由“过程”抵达事物的彼岸。"},
        {type: "p", text: "总结就是：没有真实的体验感，无从获得事物的真相，强调认知过程的重要性，你无法逾越一座叫“桥”的事物，而到了彼岸。这里我用的是“体验感”或者叫“过程感”，特意强调了“感”的作用，也是想说，获得一种感受，不一定是要亲身经历，听别人讲述或总结，也能获得对事物的认识，只是认识、感受程度有个体差异。"},
        {type: "p", text: "距离上一篇关于股市的文章，差不多过去了四个月的时间，在那篇文章里，我最主要的观点是认识到：股市消息面的不可预测性，以及消息面刺激股价带来的投资机会是难以把握的。"},
        {type: "p", text: "站在今天这个位置，当时那支西**路股票，目前股价从高点19元左右，已经来到了11元附近。跌幅接近40%。"},
        {type: "p", text: "结合我提到的“道”，这里我用排除法，股市的道，似乎不是奖赏给那些预测股市的人的。讲到这里，如果你是新人炒股，当然我也相信有很多老股民，未必形成了自己的方法论和投资信条，我们会遇到一个问题，是短期投资？中期投资？还是长期投资？"},
        {type: "p", text: "如果要类比，这就像在问，在你的人生中，做决策的时候或制定目标的时候，你更喜欢短期、中期还是长期？它似乎还在问，你能凭借你的认知方法买了一支股票，你能持股多久？"},
        {type: "note", text: "似乎道没有尽头，无限延展。还有你走阳关道，我过独木桥。也许重要的是，你适合走什么道，以及你喜欢走什么道。"},
        {type: "p", text: "好了，现在来到第二个关口，聊聊我理解的术。对于刚接触股市的人来说，应该有个不切实际的幻想，那就是希望自己买的股票总是上涨的，要是下跌，也不是下跌最多的。听一两个消息就看多一支股票，反之就看空一些股票，这些都是非常正常的心理反映。但倘若真的要将股票买卖作为一门谋生的、自力更生的技能或手段，我认为应该迅速转变以上观点，尽快抛弃这些“道听途说”的信息片段，开始认真、严肃对待股市这件事情本身。"},
        {type: "p", text: "这个过程从我自己经验谈起，就是在看过了一些糊弄人的电影后，若要真的走进电影，就要开始从电影史出发，从经典的影片开始，从那些导演的访谈开始，从那些教科书开始，从你的感受、直觉开始，感受一部电影中时间流逝的速度，感受人与人之间忽近忽远的关系，感受那些依附在镜头关注的事物表面上微弱的、猛烈的、压抑的人类的、未知的复杂情感。"},
        {type: "p", text: "当人用心的时候，事物才被人的五官察觉后所理解。这可能是道的层面，需要建立对股票的认知，我得承认这部分写的有些像是玄学的成分，让我来小结一下，股市的买卖行为本质是人的各种决策行为，当感性和理性无法完全独立存在的时候，你有多少种工具或方法论让自己保持理性交易，你的感性反映又有多少代表市场参与者的情绪。"},
        {type: "p", text: "我常常在想，股市的技术指标到底是什么？又意味着什么？目前已知的技术指标成千上百个，又有多少精力可以将他们一一研究透彻。这样的过程，又是否值得？价值投资又是一种什么样的投资？量化投资又是什么投资？而大多数股民、基民，又在使用什么策略，基于什么理由买下一只股票或者基金？如果让我来做这个决定，我又该怎么判断？我的理由又是什么？"},
        {type: "p", text: "关于类似的问题，我举个很多年前碰到的一个问题，这个问题是到底是谁让你做了一个决定？问题是这样的，如果有一天你和朋友约定去海边，可是突然第二天外面下起了雨，你还会选择去海边吗？如果会，你是基于什么理由去？如果不会，又是出于什么考虑？也许你会说，天下雨了，它阻碍了我出门，所以我就不去了，是基于这条客观原因；也许你还会设想说，雨天总让人心情压抑，没有好心情我是不愿意出门的。"},
        {type: "p", text: "好吧，你总会给自己找条可以说服自己的理由，选择雨天出门或者不出门，我想说的是，其实我们在做一个决定的时候，背后是有一种意识主导的，而你的意识判断，其实是由各种各样的外部的、周围的价值观和意识形态所影响的，也许你会因为圣经里的一句话，就做出一个判断。"},
        {type: "p", text: "从丹尼尔·卡尼曼的《思考快与慢》，我们已经知道我们做决定，有很多场景下，仅仅是基于系统一做决策，在我们的日常经验中，仅仅视觉画面足以影响一个人的判断，例如颜色鲜艳的水果往往激发人购买的冲动等等。面对股市K线图，一个数字，三根逐级抬升的阳线，足以让人做出冲动的决定，这些不足为奇。"},
        {type: "note", text: "那么有没有一种方法可以帮助我们过滤一些图形信息，而让系统二意识到要“理性”决策，这也许就是我所认为的，技术分析手段对人判断股市的作用。"},
        {type: "p", text: "让思考现身，让理性出现，让自己的思考慢下来，也许就能一定程度抑制人性中的“恐惧和贪婪”时刻，这里再插一句，关于技术指标是什么？也是需要下功夫研究和理解的，技术指标是工具，反映的是方法论，方法论往上追溯，是有一定理论基础的。目前我认为技术分析是一种追踪趋势的客观方法，关于趋势的思考，我已经写在我们第一篇文章里《股市《灵感》札记：1.时间是根本之谜》。"},
        {type: "p", text: "这段时间，我也愈加认识到，在股市里赚钱获利，一定要清楚知道自己是在用什么方法，基于什么原理，在赚什么钱。也许你会说，股市里是赚投机的钱，股市里是在赚认知的钱，股市里是在赚人性的钱...你可以在中文互联网里听到各种各样对股市赚钱的描述，说真的，我以前也是听听概念，听听词汇的人。倘若，我问你，什么叫赚投机的钱？什么叫“投机”？什么是人性？你会怎么回答。"},
        {type: "p", text: "维特根斯坦说，语言的边界就是世界的边界，要把股市当学问，还真得每个不经意说过的词汇，都得花时间去理解，去体验，我也赞同王阳明的话，知行合一。"},
        {type: "note", text: "我这短短的一生，认知的“道”和“术”可以被推向哪里？很遗憾，我们没有让时间变快的时光机器，也没有让光阴逆转的魔法，提前窥探。认知是一砖一瓦搭建的过程，而只有当黎明的曙光照耀大地的一刻，才猛然发现已经修筑起的辉煌楼阁。在自我认知这条路上，每个人注定孤独，而追问意义本身就像海妖塞壬美妙的歌喉，唯有捂住耳朵，蒙住双眼，用绳索将自己捆绑在桅杆上，方能渡过眼前这片寂静的海湾！"},
        {type: "p", text: "技术分析不是目的，技术分析是一种理解方式，是选择用数学计算，量化股票的一种观察角度。而影响市场价格涨跌的因素，有成千上百个因子，这是不确定的。而确定的又是什么？"},

    {
      id: "4",
      title: "股市《灵感》札记：2、大智若水",
      date: "2025 · 07 · 22",
      era: "二〇二五年七月二十二日",
      category: "invest",
      lead: "价值投资和依据技术面交易的投资者，以及黑天鹅作者—塔勒布，本质上都是在做“概率”的事情。",
      blocks: [
        {type: "p", text: "注：本文为一家之言，不做投资建议。"},
        {type: "h2", text: "Part 1"},
        {type: "p", text: "价值投资者如霍华德·马克斯，在今年七月份和睿远基金创始人陈光明谈话中提到：我们寻找的是当心理认知出现错误偏差，导致价格低于价值的机会，我认为这在中国已经成为现实，就像四月市场动荡时的市场一样，我认为价值投资者可以利用这些机会。"},
        {type: "p", text: "从这个角度看，价值投资是投资“大概率”事件，什么叫“大概率”。"},
        {type: "p", text: "是价格最终会回归到“价值”附近的回归现象的大概率事件。"},
        {type: "p", text: "塔勒布运用“杠铃法则”投资 “黑天鹅”事件—“小概率”但足以对公众认知及生活造成颠覆性影响的事件。以上观点使得价值投资派与塔勒布这种关注小概率事件的投资者，得以联系起来的关键词汇是“概率”。"},
        {type: "p", text: "至于霍华德马克斯与陈光明的具体谈话内容，有兴趣的朋友可以关注一下：万德3C。这个会议平台，免费注册，有很多行业干货作为普通投资者，我认为资源相当丰富了。"},
        {type: "img", src: "images/img6.webp"},
        {type: "p", text: "最近发生的一些事，不断印证了我的一些个人的、私人的观点，让我感到惊奇又兴奋。"},
        {type: "note", text: "作为个人投资者，我认为在没有第一手信息的情况下，贸然用市场上公开的消息进行交易的方式有些欠妥。"},
        {type: "p", text: "互联网平台：抖音，微信公众号，快手等等，几乎让每个国人处于信息平权的时代，看似没有了“信息差”。但信息平权的问题是，你看到的信息别人也会看到，和看清自己手牌的人打牌是一件不怎么舒服的事情。"},
        {type: "p", text: "同时互联网媒体在今天对人独立思考能力的也产生了一定影响，尤其在股市里，更需要独立思考的能力。"},
        {type: "p", text: "对于媒体的影响，我在这方面是个悲观主义者。总之，基于这一层消息做交易决策的人，会短时间内助长某支股票的股价或者让某支股票短短一天内处于严重抛压状态，股价在短期内会产生剧烈波动。"},
        {type: "p", text: "受媒体消息刺激的情绪，在这里显然成为影响股价的非理性因素。"},
        {type: "p", text: "我想通过这些文字说明什么呢？我想抛出一个问题，你觉得是先有交易还是先有消息？不妨说说你的观点。"},
        {type: "p", text: "我的观点这次很明确了，那就是作为散户投资者，是先有交易的。你可以去翻翻这段时间在雅鲁藏布江水电站，这个概念板块下的个股走势看看。"},
        {type: "p", text: "2.1万亿这个消息是突发性的，导致相关受益个股都是缩量上涨，涨停。也就是没有人真正可以做到预测股票未来的走势。"},
        {type: "p", text: "那么在这样一种环境下，当然是先有交易，然后等待消息，有概率的落到你所持有的标的上，通过交易纪律落袋为安。"},
        {type: "p", text: "总之这个答案是不言自明的。要是还有人想要通过小道消息交易，那你就要承担受骗上当或者利好消息落空的风险。"},
        {type: "p", text: "说到这里还有一种投资比如像AI这类概念。博弈的是最终AI会收益的方向。目前这些方向还处于讲故事阶段，这类投资需要时刻关注技术的发展前沿。"},
        {type: "p", text: "如果是普通投资者，会停步于理解技术层面。巴菲特及霍华德马克斯都声称不做科技股投资，人只能赚到你认知之内的钱，是一句老生常谈的话了。"},
        {type: "note", text: "第二点，就是对于“回归现象”的认识。"},
        {type: "p", text: "我认为均线系统交易的本质是交易“回归现象”。我这里不得不提到丹尼尔卡尼曼的《思考 快与慢》，当然科斯托拉尼也提过“遛狗理论”。"},
        {type: "img", src: "images/img7.webp"},
        {type: "p", text: "回归现象在统计学上随处可见，也在我们的日常生活中随处可见，只是方式是不一样的。我想提到的是，最近一段时间帮助上证指数冲破3400点到稳坐3500点的银行板块。"},
        {type: "p", text: "这个板块，我先不提什么接下来的七月份中央政治局会议对经济改善的预期，我只记得有天，我感觉终于所有人都看到了银行板块，高股息的标签、公墓基金新规、价值回归的标签等等，很多利好标签出现在银行板块。"},
        {type: "p", text: "我感觉当所有人开始关注一个板块的时候，风险可能就不远了，保持警惕。果然这几天银行板块开始了回调，我不是想说我有多么准确，我那是就是在推测，在博弈“概率”、博弈“回归现象”。"},
        {type: "p", text: "而这种事，真正出现让我对市场有了更多的敬畏，也让我对：回归现象，有了一次最直观的感受。"},
        {type: "p", text: "我并不知道这次银行会回调到哪里，因为它回调的幅度某种程度上是和另一拨做决策的人是有关系的，你想想自己为什么买银行，趋利避该是人的本性，懒惰也是人的本性。"},
        {type: "h2", text: "Part 2"},
        {type: "p", text: "这段时间，也明显感觉到自己状态上不够专注，有一些焦虑感，但说不上来是产生自哪里。"},
        {type: "p", text: "我有个随手用文字记录下一瞬间能触动我想法的习惯。以下文字，摘录自我的一些随笔，这些思维上的、难以言明本质的内容，像有个人要通过我，写下来。"},
        {type: "day", text: "6月11日"},
        {type: "note", text: "图形是表象，对实际价格的购买力是实质。——股市K线。"},
        {type: "note", text: "拥抱那些无人问津的小道，有一天会因为一个突然而至的机会，变成堵得水泄不通的网红打卡点，例如，医药股。"},
        {type: "day", text: "6月15日"},
        {type: "note", text: "诗歌在今天还有意义吗"},
        {type: "day", text: "6月20日"},
        {type: "note", text: "单根K线，是对一天完整成交时间内，买卖双方达成的对价格的概括性总结；"},
        {type: "note", text: "孤阴不生，独阳不长，两三根K线形成趋势，就代表群体的一段时间内的价格成交意愿；"},
        {type: "note", text: "趋势具有惯性(趋利避害的人类本性、贪婪恐惧的人类本性)，利用人性的惯性赚钱。"},
        {type: "note", text: "达成一个目标，不仅要有方向(趋势)还得要有持之以恒的努力(量能)——量价思考。"},
        {type: "note", text: "如果我是操盘手，我希望一支股票在低位，股价缓慢抬升，但不能放巨量。一直到我筹码够多，开始放量吸引散户关注，而后不断放量，股价波动拉升，吸引更多人关注。"},
        {type: "day", text: "6月26日"},
        {type: "note", text: "银盐不应该因为便宜而随意的落下，影像需要提炼。生活意义需要提炼。"},
        {type: "day", text: "6月27日"},
        {type: "note", text: "机构大多数是理性投资者，专业分析得出结论。散户大多数是情绪交易者，容易受到短期价格波动的形象。因此，能否有一个指标衡量散户情绪？"},
        {type: "day", text: "7月2日"},
        {type: "note", text: "放量，意味着最近有人想在这个地方买这支股票了。只是一种市场的信号，情绪的信号，至于群众的眼睛是不是雪亮的，这是值得商榷的一件事情。盲目从众的风险带来的代价也是有目共睹的。"},
        {type: "note", text: "放量之后，如果直接买进，那个赌博无异。探究放量本质，是买股票的初步工作。可能因为某种利好刺激，而让多数人选择了在这个位置买股票。"},
        {type: "note", text: "那么接下来的工作显然是像打磨一颗钻石一样。从不同的角度观察这支股票。例如："},
        {type: "sub", text: "①价格是否便宜，本质是探究价格是否还围绕价值上行。基本面的公司赚钱能力、财务状况、经营情况，有更深层的认识。但是，公司的基本面是公司的角度，公司的立场。"},
        {type: "note", text: "好公司股价的上涨必然受到相对短期资金、大额投资人、相对短期利好的各种因素影响，这里归结为外部因素。这些是公司不可控的要素，甚至这些要素在相对短期时间纬度里，起到决定性作用。价值投资者如何买到好公司而同时不受到这些外部因素的影响？可能真的就像巴菲特那样，垄断性的行业和公司，同时价值面打底，会为投资人带来长期稳健的收益。"},
        {type: "sub", text: "②如果做短期波段，那么基本面短期变好、利好消息刺激、资金轮换等等，都将成为影响股价波动的要素。这些要素缠绕、粘合在一起，有时候分不清主次，因为玩家太多，而且玩家之间互相博弈。股价真正上涨的真相，会越来越远。"},
        {type: "day", text: "7月3日"},
        {type: "note", text: "当你站在幽暗的边缘时，"},
        {type: "note", text: "它向你伸出一只手，给你一盏灯。"},
        {type: "note", text: "它向你展示它撕裂时空的能力，"},
        {type: "note", text: "它向你展示人类丰盈、怪诞的内心。"},
        {type: "note", text: "你没办法，不向他臣服——电影之神的拯救。"},
        {type: "day", text: "7月7日"},
        {type: "note", text: "股价前期走势就像抛起一枚硬币猜它的两面。而中期，人趋利避害的本性，惯性会让趋势形成。"},
        {type: "day", text: "7月10日"},
        {type: "note", text: "股价前期走势就像抛起一枚硬币猜它的两面。而中期，人趋利避害的本性，惯性会让趋势形成。事物是联系的。"},
        {type: "note", text: "沉没成本"},
        {type: "day", text: "7月11日"},
        {type: "note", text: "价值过滤波动——美的和格力从2023年之后的股价走势。"},
        {type: "note", text: "大智若水"},
        {type: "day", text: "7月15日"},
        {type: "note", text: "周线才能清楚看到主力的贪婪行径。"},
        {type: "note", text: "大级别周线上涨，才能让利润奔跑。"},
        {type: "note", text: "浙能电力2025年7月参与行情，有点一叶障目了。"},
        {type: "day", text: "7月17日"},
        {type: "note", text: "情感藏在事件背后，情感一旦被语言描述就失去了情感的所有，电影是呈现情感的合适的媒介之一。《在这里》贾樟柯的一部短片，有感。"},
        {type: "day", text: "7月18日"},
        {type: "note", text: "利用情绪赚价值回归的钱。——霍华德马克斯和巴菲特都有提到过。"},
        {type: "note", text: "这是一个能者多劳，智者多得的时代。"},
        {type: "note", text: "1.ema 双均线金叉意味着短期趋势向好，作为进场参考；2.双均线距离偏差，均线交易本质是万物均值回归的现象事实。当价格严重偏离0轴时，若个股基本面（价值面）没有发生变化，可在PO数值向O轴回归时作为买入参考；3.注重极致区间的回归。"},
        {type: "img", src: "images/img8.webp"},
        {type: "day", text: "7月22日"},
        {type: "note", text: "股市图形增加一定胜概率。过去对现在有影响，大跌让人畏惧，大跌也让人坚韧。不用百分百的因果判断事物，而用概率思维。价值派用事实看到了股价的非理性波动，他们不是没有概率思维，他们恰恰相信大概率。"},
        {type: "note", text: "承接上条，价值派用大概率投资。塔勒布用小概率投资。"},
      ]

    {
      id: "8",
      title: "影像剪辑逻辑分析——《尼斯印象》",
      date: "2024 · 08 · 11",
      era: "二〇二四年八月十一日",
      category: "image",
      lead: "然而“影像”应该从哪里开始，又该从哪里结束？一段影像和下一段影像，又因为什么“理由和逻辑”可以放在一起，进而表达清楚制作影像的人，真正的意图？这就需要追问“影像语言”的语法。",
      blocks: [
        {type: "p", text: "在当下，我们和别人交流的时候：我们知道在什么时候该说第一个字；什么时候该用一个“词语”；什么时候会说“此外、与此同时、总而言之、这让我想起了”等等这些“连接词”；什么时候又该结束一句话，一段话，一篇完整的“演讲词”。我们几乎没有思考的过程，一句话就脱口而出了。“字、词、句、段落、文章”，我们已然已经掌握其基本的用法。"},
        {type: "p", text: "这是因为，语言的习得，我们是从小开始的。我们凭借“人类本能”，“环境的潜移默化”，就能轻易掌握一门“本地方言”，但如何将“本地的方言”转化为更多人都能理解的“文本语言”和“普通话”。我们开始引入“专业化、系统化”的汉语学习。而后才能“听、说、读、写”。"},
        {type: "p", text: "有了“系统化”学习的过程，我们对“语言”的运用也越来越熟练，有的人运用得好，当了“作家”、有的人成为“外交官”等等。"},
        {type: "sep", src: "images/img29.webp"},
        {type: "p", text: "在我的记忆中，我们“村”的本土化的“影像”的表达，是泥墙上的“标语”、是每一尊“泥塑”身上飘着的红丝带，是淡蓝色的远山与泛着金色的汉江水波，是裸露的河滩巨石阵以及祭祀之火点燃的荒山野草。除了这些，我的“影像”首先来自遥远的“童年记忆”和不可思议的“梦境”，重复的“梦境”曾一度困扰着我，而那段影像片段最终居然成为我每次躲避、逃离噩梦的“安全庇护所”。"},
        {type: "p", text: "我想说的是，每个人都拥有自己的“影像”，那是“本土化”的，或者叫“私人化”的，一旦涉及大众传播的“影像”，我们便形成了一些行业内的“影像语法”，这部分内容经由一代代“影像制作者、以及影像爱好者”共同完善和创造。熟练掌握这些“基本影像语言语法”，才会更明白一段影像传达的“意图”，在此基础上，一段影像是可以超越人类“语言障碍”，进行交流的。"},
        {type: "quote", text: "在一部故事片中大约有1500个镜头，而将这些镜头组成一个整体并按照正确的顺序排列，一直是格里菲斯、威尔斯、戈达尔、黑泽明、斯科塞斯、赫尔佐格这些电影大师们以及诸多新生代导演毕生探索的，具有挑战性的，令人抓狂的难题。"},
        {type: "p", text: "《电影镜头设计--从构思到银幕》【美】史蒂文·卡茨"},
        {type: "img", src: "images/img30.webp"},
        {type: "p", text: "让·维果，1905年4月26日生于巴黎，1934年10月5日逝于巴黎，无政府主义者阿尔梅雷达之子。"},
        {type: "p", text: "1929年：《尼斯的景象》"},
        {type: "p", text: "1932年：《操行零分》"},
        {type: "p", text: "1932年：《塔利斯》"},
        {type: "p", text: "1934年：《驳船阿塔朗特号》"},
        {type: "img", src: "images/img31.webp"},
        {type: "p", text: "《尼斯印象》的剪辑方式思考："},
        {type: "h3", text: "基本剪辑语法知识补充："},
        {type: "h3", text: "【1】剪辑的基本层次"},
        {type: "sub", text: "1.“静”接“静”。2.“动”接“动”。"},
        {type: "sub", text: "2.①相隔景别相接，画面不跳。"},
        {type: "sub", text: "②相邻景别相接的两种情况：逐步式递进/退出"},
        {type: "sub", text: "3.成组的镜头能够表达完整的画面内容，单个镜头很难完成叙事任务。通常把成组的镜头分为三类：11.环境类；22.关系镜头；33.细节镜头。补充：一镜到底没有剪辑，但能完整叙事，是因为其是由运动镜头组成的叙事“镜头组”。"},
        {type: "h3", text: "【2】蒙太奇（镜头的组织形式）：宏观/中观/微观层次"},
        {type: "h3", text: "微观蒙太奇（上下两个镜头间）的剪辑依据有三种类型："},
        {type: "sub", text: "1.动作剪辑点（出/入画；动作承接）；2.情绪剪辑点；3.节奏剪辑点（罗列等长的镜头）；"},
        {type: "h3", text: "中观蒙太奇（段落镜头之间的剪辑）的剪辑依据有七种常见类型："},
        {type: "sub", text: "1.出画入画转场；2.两极镜头；3.遮挡镜头；4.相似体；5.承接转场；6.声音转场；7.运动镜头转场；"},
        {type: "h3", text: "宏观蒙太奇（整个片子的结构）主要分为三类："},
        {type: "sub", text: "1.叙事蒙太奇{11.平行叙事蒙太奇；22.交叉蒙太奇叙事；33.复现式蒙太奇叙事（类似现实和历史，往事浮现）44.叫板式蒙太奇}"},
        {type: "sub", text: "2.表意蒙太奇{11.隐喻蒙太奇；22.对比蒙太奇；33.积累蒙太奇；44.心理蒙太奇}"},
        {type: "p", text: "资料来源：《视听语言》孙振虎主编——高等教育出版社"},
        {type: "h2", text: "【Part1】"},
        {type: "img", src: "images/img32.webp"},
      ]

    {
      id: "3",
      title: "股市《灵感》札记：1、时间是根本之谜",
      date: "2024 · 04 · 10",
      era: "二〇二四年四月十日",
      category: "invest",
      lead: "我想时间是一个根本之谜，其他东西顶多只是难以理解。",
      blocks: [
        {type: "quote", text: "如果一个人在梦中，穿过了极乐之地。保留下一朵花作为他经过的证据。醒来时，发现这朵花在他的手里，该说些什么？我就是那个人。——戈达尔"},
        {type: "p", text: "这段时间最大的感悟是，时间是根本之谜。道氏理论揭示了趋势的存在、波浪理论用分形解构了趋势、而他们都没有解决一个问题，那就是趋势究竟在什么时间下才会发生反转？这就自然引出一个问题，何为“时间”。而江恩理论必定会出现在股市中，江恩试图揭示“时间”这个根本之谜，未解之谜。"},
        {type: "img", src: "images/img0.webp"},
        {type: "p", text: "另外一点是，股市是一个人的战场，思维的战场，想象力的战场，对手是“上帝”、对手是“虚构的千军万马”，德国证券教父安德烈·科斯托拉尼说，投机并非一门科学，而是一场艺术。我也将自己这段时间的一些思考，按照线性时间的方式，记录了下来。其中很多问题，总是会追问到本源问题，让人困惑不已。（建议阅读时，可以选择一日，内容从下往上读，因为我的思考，在这个过程中不断修正，有些或许又不断被重复；同时如果你在阅读时，会出现语病或者不连贯问题，可以只浏览其大意，理解即可。因为这些是我怕转瞬即逝，随手记下的，未作任何改正，语言文字本身有时又是一种阻碍，不是吗。）"},
        {type: "day", text: "2024.4-10"},
        {type: "note", text: "当你成为规律本身的时候，规律便被你发现。有没有一种可能，大自然本身运转是规律的。而人类活动是不规律的。隔一段时间就发生一下，体现了人类情绪的反复。而，人类总是觉得是大自然赋予了人类某种规律。也许，是一两次，人类和大自然的部分同频共振，仅此而已。人类却妄图，用这种规律指导下一次人类的规律。"},
        {type: "day", text: "2024.4-9"},
        {type: "note", text: "人心不古，意味着波动性。"},
        {type: "note", text: "这就是顺从大趋势。当主力提前决定了，今日的大趋势向下的时候，其他人的小趋势已经对股价不起任何作用了。这种大趋势是超前的，甚至没有征兆的。唯一能对抗这种逆势的，是对波动性的敬畏，人心不古，是从古至今保留的DNA。"},
        {type: "img", src: "images/img1.webp"},
        {type: "day", text: "2024.4.8"},
        {type: "note", text: "人的理智是逐渐丧失的，一开始有基本面，政策面利好，利空。股价依次反映。而一旦长涨，长跌。持股人的情绪就会失控，感性开始凌驾于感性分析之上。股市价格，和市场彻底失去联系。作为一名场外隔岸观火的投机者，应该在情绪至极的地方。参与博弈。【例如，恐慌至极的股价最低点介入。贪婪至极的股价最高点，止盈离场】"},
        {type: "note", text: "什么是好故事？好故事是永远讲不完的好故事。【一个是质量上的精彩程度，一个是时间纬度的长】"},
        {type: "note", text: "在股市中，同样如此。这就是人性。人，活在一个又一个偏见之中。人，注定一生都要为自己的偏见，买单。修正，一个又一个偏见，才能接近事物的本质。股票的博弈性，在于你得提前想到其他人的想法。而且是及其合理的理由。越理性越好。你得提前交易这个预期，而且相信大众会跟上你的思路预期。趋势便由此形成。也就是，以前地上本没有路，想象力的人，想象出了一条路。后来的人，确实一步一会脚印踩出来了路。"},
        {type: "day", text: "2024.4-7"},
        {type: "note", text: "股市里，博弈或者投机。不是今天晴天，就全部押注明天降雨。而是今天雨天，今天或者明天大概率还是降雨。这就是大自然的趋势。操作上，就像农民，雨天来临之前做好风险。以及损失的可能性。"},
        {type: "note", text: "应该将小部分资金博弈大的风险。杠铃法则。"},
        {type: "note", text: "股市是各个参与人类的各种选择的博弈结果。而有些选择，往往超乎其运行趋势。也就是说，和大部分的，又或者说。和纯数学上的预测，相违背。原因就是，人性有时候是趋势性的，有时候是反趋势性的。例如，按道理，希特勒攻进巴黎的时候，巴黎股市应该崩溃，而有人就是赌了一把繁荣。"},
        {type: "note", text: "现在就是未来，未来就是过去。过去就是现在。"},
        {type: "note", text: "股市中，支撑位和压力位的本质是："},
        {type: "sub", text: "1. 【支撑位】在这个价格区间的持股人，如果股价突破该位置，这部分群体不会将股票轻易卖出，还会期望股价继续上涨。当然，有一个大的前提是，此时的股价在相对的中低位。高位往往会有人期望获利了结。当然，这里的股价高位是没有加上时间的纬度，如果考虑此纬度，那么股价短期内迅速达到高点，会相较于股价慢慢达到高点(上升通道中)，更具有不稳定性。(你也可以理解为斜率)。因此，需要验证，支撑位。结合分时成交，观察这个位置，是主卖还是主买。"},
        {type: "sub", text: "2. 反之。"},
        {type: "note", text: "一鼓作气，再而衰，三而竭。彼竭我盈。"},
        {type: "note", text: "事物的产生变化，变化产生就是周期产生，周期就是时间。"},
        {type: "note", text: "市场本没有方向，选择的人多了，也就产生了方向。(趋势)"},
        {type: "note", text: "美国道琼斯1884；电影诞生1895"},
        {type: "note", text: "股市里没有上帝，人类是自己的上帝。大自然中没有上帝，大自然是自己的上帝。"},
        {type: "day", text: "2024.4-6"},
        {type: "note", text: "幸福的人都是相似的，不幸的人各有各的不幸。安娜•卡列林娜。"},
        {type: "note", text: "股市供不应求，股价就会上涨。而股市下跌时，一家企业仍然可以实现不错的利润，可以给股东可观的分红。"},
        {type: "p", text: "总结就是："},
        {type: "sub", text: "1. 股价在下跌过程中，成交量一次比一次大，说明有人(勇敢者，看多者)愿意接盘买进。这部分股票会等待下跌反弹时将其卖出。"},
        {type: "sub", text: "2. 股价下跌中，无量下跌，意味着市场前景不容乐观。意味着，股票还在胆小鬼手里(看空者)。卖出股票于他们而言，只是时间问题。"},
        {type: "sub", text: "3. 所以，要谨慎对待市场中的一种常见观点：大交易量，情况下的股市上涨是有利可图的。只有，小成交量，甚至无交易量，情况下仍然看涨，才是绝对有利可图。"},
        {type: "p", text: "用科斯托拉尼的书中话总结："},
        {type: "p", text: "如果市场在交易量很小的情况下↑或者↓，这意味着它还会持续↑或者持续↓。如果，市场在越来越大的交易量下，↑或者↓，这种趋势是不会持久的。"},
        {type: "p", text: "【自己对这句总结的理解】"},
        {type: "sub", text: "1. 往往国内的a股市场中，可以看到，放量集中的那一部分，股价是上涨最凶猛的。但作为交易者，应该在这波上涨之前已经提前介入。而不是等，成交量已经放出来了。这意味着，很多人已经进场了。这时候很可能就是第三阶段了。"},
        {type: "p", text: "ema12.50攻守线，金叉。其实是意味着，短期股价在向长期股价回归。如果，是回归一定得让股价上涨。所以，看到短期均线拐头，是一种上涨的征兆。其他的技术指标应该还可以观察出这些早于市场大众的征兆点。例如，macd指标。底部金叉，是短线靠近长线，而macd中，dif上穿0轴，是两条，均线金叉出现。"},
        {type: "sub", text: "2. 下跌缩量，并不是一定是一件好事。有人经常会说，下跌缩量，恐慌资金未出逃。但，恐慌资金不出逃，胆小鬼卖股票只是迟早的事情。所谓一鲸落(卖空者，当然他们开始是看多者，因为很多负面消息，慢慢转化为看空者)而万物生。"},
        {type: "sub", text: "3. 由此可以引申出另一个指标。就是换手率。换手率是成交量和流通股本的比值，有个说法是，市场的情绪观察指标中，换手率＞成交量。高换手率的核心本意就是描述，股票从胆小鬼到勇敢者的转换。指标本身没有明确显示，最终股票到了谁的手中。"},
        {type: "p", text: "也许可以做推测，结合股价趋势，如果下跌趋势，而换手率不断提升，意味着，股票从看空者到了看多者手中。反之。"},
        {type: "sub", text: "4. 之前看过一个策略，macd底部金叉叠加，高换手率。其实，这个策略描述的就是，股价下跌途中，价格有反弹迹象，同时高的换手，意味着，股票经常了多空的转换。而大概率是，由空到多。接下来，有利于，上涨趋势的延续。"},
        {type: "day", text: "2024.4-4"},
        {type: "note", text: "人拥有两只眼睛，一只眼睛聚焦当下，一只眼睛投向未来。两只眼睛的影像重叠，将影像传递给大脑。这也许就是，影像淡入淡出的最初灵感来源。"},
        {type: "note", text: "道氏理论核心，顺大逆小。"},
        {type: "note", text: "承接上条，其实也就是可以看出来。"},
        {type: "p", text: "一个股票是周线经常波动一次，还是月线波动一次。还是年线波动一次。周期品种就确定了。而周期品种的确定则是一件需要大量研究的事情。"},
        {type: "p", text: "就像农民播种到丰收，农作物本身是有周期的。这种自然的周期是经过不断经验的累积总结出来的。"},
        {type: "p", text: "假如，假设种麦子，就得半年。"},
        {type: "p", text: "而，买股票，如果半年线下跌中，就意味着这只股票目前来看不能拿半年，但月线上在走上升了。意味着，周线可以持有。"},
        {type: "p", text: "周线上 根据 道氏理论 低点不断下降，直至 大阴线一根破位 ；趋势发生反转。"},
        {type: "p", text: "但本质是，从日线观察，日线上(小趋势)已经提前发生下跌趋势。周线破位是迟早的事情。"},
        {type: "p", text: "联系到波浪理论，有条规定是，小周期不会穿越大周期。就是大周期上是下跌的，小周期里，多头实力不会太强，利空。"},
        {type: "p", text: "反之，大周期上行，空头实力不会太强，利多。"},
        {type: "p", text: "从上面这个案例可以推出，日线因为多头不强，导致了周线破位。"},
        {type: "note", text: "实战中："},
        {type: "sub", text: "1. 应该看周线，趋势，做日线交易。"},
        {type: "p", text: "如果周线空，日线要么就不做了。"},
        {type: "p", text: "周线空，有利于，日线交易者卖出股票比较准确。"},
        {type: "sub", text: "2. 周线趋势多，做日线交易多。卖出时间应该看，60分钟线。"},
        {type: "note", text: "合格的农民应该是最会炒股的人。因为他知道敬畏规律，敬畏周期。同时提前应对风险。"},
        {type: "img", src: "images/img2.webp"},
        {type: "note", text: "接个上条总结：核心就是，波浪理论的第三浪，绝对不是最小的波浪，来源于道氏理论。因为只有确定了，第三浪不是最小的波浪。"},
        {type: "sub", text: "1. 最长的波浪，会反馈给第一浪，两两加成，会让趋势延续。"},
        {type: "sub", text: "2. 和第一浪对等的波浪，还是会反馈给第一浪，两两加成，会让趋势延续。不过这种会比第一种，稍微概率低一点。"},
        {type: "sub", text: "3. 如果直接是最小的波浪，趋势就大概率会反转。趋势结构就不稳定了。出现了分歧。情况较为复杂。"},
        {type: "p", text: "所以，最稳定的波浪结构，或者说趋势结构，就是3浪结构。"},
        {type: "p", text: "也就是说"},
        {type: "sub", text: "1. 如果 一波下跌 趋势中 主要运动 衰竭 次波的反弹幅度和上一个次波运动对等，那么次波运动大概率变成 主要趋势运动；下跌趋势发生了 反转。"},
        {type: "sub", text: "2. 反之 如果 一波上涨趋势中 主要运动 衰竭 大概率次波运动 开始变 主要趋势 ；整个上涨趋势衰竭 转头向下概率加大。"},
        {type: "p", text: "总结来说 这和波浪理论及其相似 波浪理论中的 第三浪 绝对不会是 最小的波浪 其实某种程度上 是在讲，这波对趋势的关键性确定。"},
        {type: "note", text: "孤山寺北贾亭西，水面初平云脚低。"},
        {type: "p", text: "几处早莺争暖树，谁家新燕啄春泥。"},
        {type: "p", text: "乱花渐欲迷人眼，浅草才能没马蹄。"},
        {type: "p", text: "最爱湖东行不足，绿杨阴里白沙堤。"},
        {type: "p", text: "—趋势理论。"},
        {type: "note", text: "高低点的确认是，趋势反转的标准。"},
        {type: "day", text: "2024.4-2"},
        {type: "note", text: "承接上条，就是一旦事情发生，不要百分百肯定某件事，导致了结果。这不一定是原因。进而要重视，事情的发生，可能会导致的下一个未发生的结果。历史经验的作用在于，参考。"},
        {type: "p", text: "把因果，换成，正负反馈。例如，原始人野外被野兽攻击，险些丧命。"},
        {type: "p", text: "反馈的结果是，下次出门会带武器。"},
        {type: "p", text: "这个事件中，应该禁止使用，因为原始人被野兽攻击，所以下次出门带武器，也有可能带盔甲，也有可能还是不带任何东西。因为a，可能会导致b.c.d.e.f.g.这些都是结果。"},
        {type: "p", text: "而，如果用结果去推测原因，会是h.i.j.k.等等。"},
        {type: "note", text: "趋势交易者，大趋势反转进，60分钟级别小趋势走坏卖。"},
        {type: "note", text: "承接上条，银行、高姑息股是大资金的避风港。巨鲸股，是大资金的坐骑。大资金才是市场的巨鲸，方向的引领者。"},
        {type: "p", text: "(巨鲸，有理由是一轮板块行情里全方面利好的承载者，大资金理应交易该只个股。)"},
        {type: "p", text: "而大资金集体配置的个股，会是航海家们的北极星。北极星的指引，会引导，趋势的发展。观察，一颗市场中，耀眼的北极星。会让你对大势有更多理解。"},
        {type: "p", text: "例如："},
        {type: "sub", text: "1. 大盘创新低，而茅台不在继续下跌。"},
        {type: "p", text: "可以理解为，大盘反转时点。当然，关键还是观察周期，只能较平时，更大一点的周期，才能确定性更好。"},
        {type: "sub", text: "2. 大盘指数创新高，而茅台不在继续大涨。"},
        {type: "p", text: "也意味着大盘即将封顶。"},
        {type: "img", src: "images/img3.webp"},
        {type: "img", src: "images/img4.webp"},
        {type: "img", src: "images/img5.webp"},
        {type: "note", text: "过去一定重塑着现在，现在受过去影响。现在也在修正着过去。"},
        {type: "note", text: "承接上条："},
        {type: "p", text: "趋势交易者应该在极致区域进行交易。"},
        {type: "p", text: "(但有个前提，股票基本面要过关。要是不死鸟。)"},
        {type: "p", text: "因为，极度恐慌，和极度贪婪往往是人性至极的地方。"},
        {type: "sub", text: "1. 极度贪婪，也就是股价高位时，群体性(深陷其中者)会反映出股价还会创新高，会加大买入力度。而理性人，需要卖出，终止贪婪，当然因为趋势的力量，或者因为盲目贪婪的力量，股价还会继续上升，但速度会越来越慢，这时候股价大概率下挫。"},
        {type: "p", text: "【重点:也许这时候可以根据，RSI强弱指标，判断，RSI冲上80后，横向走或者出现拐头向下，如果刺破80线，可以选择止盈离场"},
        {type: "p", text: "又或者可以根据，ema 长短均线，死叉，其实就是描述，两均线迅速聚拢，速度下滑，上涨无力的表现。】"},
        {type: "sub", text: "2. 极度恐慌，是股价连续下跌时。群体性，会加剧下跌过程。而理性人可以考虑进场。"},
        {type: "p", text: "还是技术指标，RSI出现，拐头向上穿过30等。或者MACD出现，底部金叉。这本身就是一种，速度减缓的征兆。意味着，跌无可跌。但macd只是对价格的判断。缺乏成交量的再度确认。所以。macd叠加成交量放大。其实描述的就是。股价处在底部减速区域，有些人开始做交易的信号。也许会形成又一波上涨趋势。"},
        {type: "p", text: "之所以会出现，上涨趋势失败。影响的因素很多。如果是基本面问题，或者其他不可逆因素。这只股价，趋势形成就会有问题。"},
        {type: "p", text: "因此标的很重要。而且，踩准。群体性情绪的引燃点很重要。(这就具体到各种利好因素上了，会很多很多因素)。"},
        {type: "p", text: "若股价出现极值区域，(极低、极高时)"},
        {type: "p", text: "股市是对理性人的终极考验(股价创新高，是极度贪婪，任由贪婪情绪支配，还是理性回归其原有价值；股价持续新低，还要继续恐慌？)"},
        {type: "note", text: "承接上条"},
        {type: "p", text: "不要在分歧中，信息混沌中买卖股票。(正如不要在模棱两可中，做出选择，那是赌天运)"},
        {type: "p", text: "趋势交易者，永远在趋势中做交易。"},
        {type: "p", text: "而且一定是在趋势形成早期进场，而不是趋势彻底形成后进场，那是后知后觉者。很有可能是第三波进场的人，如果趋势崩盘，大概率没办法全身而退。而趋势早期交易者，会在最后的趋势崩盘前，收获丰厚利润，离场。如果是系统性风险，黑天鹅事件，会让大部分收益，回吐。所以，通过杠铃法则，80%获利了结，也许是不错的选择。学会敬畏市场。敬畏人性(极度恐慌和极度贪婪)。"},
        {type: "note", text: "结合上条："},
        {type: "p", text: "如果说群体性(大盘)的多、空，1.出现股价上涨。证明是趋势形成的前期。2.如果此时伴随着成交量的逐步，放大(买与卖的情绪)。这段趋势(这波情绪)会再次得到验证。"},
        {type: "sub", text: "3. 但周期永远是未解之谜。(正如博尔赫斯所言。)趋势开启之后，谁都无法知道他会在什么地方终结，4.第一个理性的人(也是未知)，产生低价主动卖出行为，第二个人产生卖出行为。直到一传二，二传三，恐慌情绪蔓延，股价指数性暴跌，终结这段趋势，大多数人回到现实。"},
        {type: "p", text: "也就是，周期望望能发现转折点。"},
        {type: "p", text: "较短的周期，会形成噪声。"},
        {type: "p", text: "较大的周期，会过滤掉，关键节点。(正如路遥在平凡的世界中所言，人生是由重要的转折，关键几个步骤构成的)。"},
        {type: "p", text: "如何确定一波行情的周期，便显的尤为重要，正如，一天有24个小时，形成白昼与黑夜。那行情的涨跌如何识别周期。"},
        {type: "p", text: "周期就是波动，交替。"},
        {type: "p", text: "每个事物都有不同周期。"},
        {type: "p", text: "可以先说一个我观察到的周期，低价股因为风险相对较小，所以周期，涨跌相对稳定。"},
        {type: "p", text: "推出来就是，股价低点，望望人心比较稳定。而一旦股价上涨，就会让股价进入剧烈波动区间。(至少是相对于低位股价来说)。股价越高，波动风险可能会越大。也就是说，趋势在早期，趋势越稳定。成交量也是相对较小。随着大盘(或者说整个相关板块或者，一两，三，四个关联个股，开始出现成交量放大，伴随着股价抬升，我认为此处成交量和股价抬升分不清先后顺序)上涨，第二个，买入机会便出现了。"},
        {type: "p", text: "更多人发现板块大涨，是多数人在第三个趋势阶段买入。也是上涨幅度，不是最小的一波上涨(这里和波浪理论的第三浪要求结构太像了)。因为，消息如果越混沌，情绪越混沌。很可能迎来第四，第五次买入机会。但越往后，风险越大。"},
        {type: "p", text: "同时如果，一波拉升幅度过大。就会一波透支所有利好消息。如果没有更大利好支撑。群体性的期望就会瞬间崩塌。股价会踩踏式或者地震式，崩盘。趋势宣告结束。"},
        {type: "p", text: "对，道氏理论，波浪理论，正负反馈，趋势形成等的思考。"},
        {type: "day", text: "2024.4-1"},
        {type: "note", text: "结合上条，有点正负反馈意思。"},
        {type: "note", text: "道氏理论，强调大盘与个股的互相印证，也许是在确定，群体与个股的交易情绪。"},
        {type: "p", text: "换句话说，因为看到群体的异动，所以确定了趋势的基础。因而选择个股，便只是顺势而为了。道氏理论思考。"},
        {type: "p", text: "是正、反向反馈与天然信息差(混乱区域)"},
        {type: "p", text: "促成了某种多、空趋势的延伸。"},
        {type: "p", text: "利用或者是借助，混乱区域(群体混乱)特性。"},
        {type: "p", text: "完成交易的买入和卖出。"},
        {type: "note", text: "乐音是有序的，噪音是无序的。"},
        {type: "p", text: "股票涨跌，呈现趋势性，有惯性。"},
        {type: "p", text: "如果，涨跌不交替，完全无序。"},
        {type: "p", text: "可以选择有秩序的市场或者标的交易。道氏理论思考。"},
        {type: "day", text: "2024.3-30"},
        {type: "note", text: "道生一，一生二，二生三，三生万物。万物负阴而抱阳。波浪理论。"},
      ]
    },
  ];

  // ============ 分类 ============
  const categories = [
    { slug: "essay", name: "日常随笔" },
    { slug: "invest", name: "投资札记" },
    { slug: "rings", name: "年轮" },
    { slug: "image", name: "影像之门" }
  ];

  const home = document.getElementById("home");
  const article = document.getElementById("article");
  const categoryView = document.getElementById("category");
  const catalog = document.getElementById("catalog");
  const categoriesEl = document.getElementById("categories");
  const categoryCatalog = document.getElementById("category-catalog");

  function renderCatalog() {
    catalog.innerHTML = posts.map(p => `
      <li>
        <a class="post-link" href="#/post/${p.id}">
          <span class="title">${p.title}</span>
          <span class="dots"></span>
          <span class="date">${p.date}</span>
        </a>
      </li>
    `).join("");
  }

  function renderCategories() {
    categoriesEl.innerHTML = categories.map(c => {
      const n = posts.filter(p => p.category === c.slug).length;
      return `<a class="category-card" href="#/cat/${c.slug}">
        <span class="cat-name">${c.name}</span>
        <span class="cat-count">${n} 篇</span>
      </a>`;
    }).join("");
  }

  function renderCategoryPage(slug) {
    const c = categories.find(x => x.slug === slug) || categories[0];
    const list = posts.filter(p => p.category === c.slug);
    document.getElementById("category-title").textContent = c.name;
    document.getElementById("category-sub").textContent = "共 " + list.length + " 篇";
    categoryCatalog.innerHTML = list.map(p => `
      <li>
        <a class="post-link" href="#/post/${p.id}">
          <span class="title">${p.title}</span>
          <span class="dots"></span>
          <span class="date">${p.date}</span>
        </a>
      </li>
    `).join("");
    document.title = c.name + " · 南山怪客文集";
    window.scrollTo(0, 0);
  }

  function renderBlocks(blocks) {
    return blocks.map(b => {
      if (b.type === "h2") return `<h2 class="section">${b.text}</h2>`;
      if (b.type === "h3") return `<h3 class="sub">${b.text}</h3>`;
      if (b.type === "quote") return `<blockquote>${b.text}</blockquote>`;
      if (b.type === "list") return `<ul class="essay-list">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
      if (b.type === "day") return `<div class="day">${b.text}</div>`;
      if (b.type === "note") return `<p class="note">${b.text}</p>`;
      if (b.type === "sub") return `<p class="sub-note">${b.text}</p>`;
      if (b.type === "img") return `<figure class="figure"><img src="${b.src}" alt="" loading="lazy"></figure>`;
      if (b.type === "sep") return `<div class="sep"><img src="${b.src}" alt="" loading="lazy"></div>`;
      if (b.type === "mark") return `<div class="mark">${b.text}</div>`;
      if (b.type === "cap") return `<div class="cap">${b.text}</div>`;
      return `<p class="body">${b.text}</p>`;
    }).join("");
  }

  function randomizeArticleBg() {
    const el = document.getElementById("article");
    el.style.setProperty("--bg-scale", Math.round(180 + Math.random() * 80) + "%");
    el.style.setProperty("--bg-x", Math.round(15 + Math.random() * 70) + "%");
    el.style.setProperty("--bg-y", Math.round(15 + Math.random() * 70) + "%");
  }

  function renderPost(id) {
    const p = posts.find(x => x.id === id) || posts[0];
    document.getElementById("article-title").textContent = p.title;
    document.getElementById("article-date").textContent = p.date;
    document.getElementById("article-lead").textContent = p.lead;
    document.getElementById("article-era").textContent = p.era;
    document.getElementById("article-body").innerHTML = renderBlocks(p.blocks);
    document.title = p.title + " · 南山怪客文集";
    randomizeArticleBg();
    window.scrollTo(0, 0);
  }

  function route() {
    const h = location.hash;
    if (h.startsWith("#/post/")) {
      renderPost(h.slice(7));
      article.classList.add("active");
      home.classList.remove("active");
      categoryView.classList.remove("active");
    } else if (h.startsWith("#/cat/")) {
      renderCategoryPage(h.slice(6));
      categoryView.classList.add("active");
      home.classList.remove("active");
      article.classList.remove("active");
    } else {
      document.title = "南山怪客 · 文集";
      article.classList.remove("active");
      categoryView.classList.remove("active");
      home.classList.add("active");
    }
  }

  renderCategories();
  renderCatalog();
  route();
  window.addEventListener("hashchange", route);

  // ===== 双击图片放大 =====
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  function closeLightbox() {
    lightbox.classList.remove("open");
  }

  document.addEventListener("dblclick", function(e) {
    const img = e.target.closest(".figure img");
    if (!img) return;
    lightboxImg.src = img.src;
    lightbox.classList.add("open");
    e.preventDefault();
  });

  lightbox.addEventListener("click", function(e) {
    if (e.target === this || e.target.classList.contains("lb-close")) closeLightbox();
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeLightbox();
  });
</script>

</body>
</html>
