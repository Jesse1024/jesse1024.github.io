<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南山怪客 · 文集</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">
<style>
  :root {
    --paper: #f4ecdc;    /* 暖米白宣纸底 */
    --ink:   #241e14;    /* 暖褐黑 */
    --muted: #8a7d66;    /* 暖灰褐 */
    --line:  #ddd2bd;    /* 暖细线 */
    --cinnabar: #a63a2b;/* 朱砂 */
    --serif:  "LXGW WenKai", "霞鹜文楷 中粗", "霞鹜文楷", "楷体", "KaiTi", serif;  /* 正文：霞鹜文楷 Regular */
    --title:  "LXGW WenKai", "霞鹜文楷 中粗", "霞鹜文楷", serif;  /* 标题：霞鹜文楷 Bold */
    --song:   "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;  /* 站名：思源宋体 */
    --sans:   "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Arial", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; scrollbar-gutter: stable; }

  /* 纸质感：淡墨山水画背景 + 细纤维噪点 */
  body {
    background-color: var(--paper);
    background-image:
      /* 细纤维噪点（叠在山水画上，增加纸感） */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>"),
      /* 调淡后的山水画背景 */
      url("background.jpg");
    background-size: auto, cover;
    background-position: center, center;
    background-repeat: repeat, no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.6;
  }

  /* ============ 骨架 ============ */
  .view {
    display: none;
    min-height: 100vh;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .view.active {
    display: block;
    opacity: 1;
    transform: none;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ============ 主页 ============ */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 44px 0 0;
  }
  .masthead .name {
    font-family: var(--song);
    font-size: 17px;
    letter-spacing: .4em;
  }
  .masthead .tag {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .3em;
  }

  .home-glyph {
    display: flex;
    justify-content: center;
    margin: 72px 0 20px;
  }
  .home-glyph svg { display: block; }

  .spin {
    animation: spin 120s linear infinite;
    transform-origin: 50% 50%;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .intro {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-family: var(--serif);
    letter-spacing: .32em;
    margin-bottom: 96px;
  }

  .catalog {
    list-style: none;
    border-top: 1px solid var(--line);
  }
  .catalog li { border-bottom: 1px solid var(--line); }

  .post-link {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 34px 4px;
    text-decoration: none;
    color: inherit;
    position: relative;
  }
  .post-link .title {
    font-family: var(--title);
    font-weight: bold;
    font-size: 27px;
    letter-spacing: 0;
    transition: transform .3s ease, color .3s ease;
    white-space: nowrap;
  }
  .post-link .dots {
    flex: 1;
    border-bottom: 1px dotted var(--line);
    transform: translateY(-4px);
    transition: border-color .3s ease;
  }
  .post-link .date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
    white-space: nowrap;
  }
  .post-link::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 50%;
    width: 3px; height: 3px;
    background: var(--cinnabar);
    border-radius: 50%;
    transform: translateY(-50%) scale(0);
    transition: transform .3s ease;
  }
  .post-link:hover .title { transform: translateX(14px); color: var(--cinnabar); }
  .post-link:hover .dots { border-color: var(--cinnabar); }
  .post-link:hover::before { transform: translateY(-50%) scale(1); }

  .colophon {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 36px 0 64px;
    font-size: 11px;
    color: var(--muted);
    font-family: var(--sans);
    letter-spacing: .22em;
  }

  /* ===== 分类页卡 ===== */
  .categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
    margin: 0 0 84px;
  }
  .category-card {
    display: block;
    border: 1px solid var(--line);
    padding: 34px 28px;
    text-decoration: none;
    color: inherit;
    position: relative;
    background: rgba(244, 236, 220, .35);
    transition: border-color .3s ease, transform .3s ease;
  }
  .category-card:hover {
    border-color: var(--cinnabar);
    transform: translateY(-3px);
  }
  .category-card .cat-name {
    font-family: var(--title);
    font-weight: bold;
    font-size: 26px;
    letter-spacing: .02em;
    display: block;
  }
  .category-card .cat-count {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .2em;
    display: block;
    margin-top: 16px;
  }
  .category-card::after {
    content: "";
    position: absolute;
    top: 20px;
    right: 20px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cinnabar);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .category-card:hover::after { opacity: 1; }

  /* ===== 分类页 ===== */
  .category-title {
    font-family: var(--title);
    font-weight: bold;
    font-size: 40px;
    letter-spacing: .04em;
    text-align: center;
    margin: 44px 0 10px;
  }
  .category-sub {
    text-align: center;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
    margin-bottom: 52px;
  }

  /* ============ 文章页 ============ */
  .article-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 44px 0 0;
  }
  .back {
    text-decoration: none;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: .22em;
    transition: color .3s ease;
  }
  .back:hover { color: var(--cinnabar); }
  .article-head .date {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .22em;
  }

  .article-glyph {
    display: flex;
    justify-content: center;
    margin: 72px 0 8px;
  }
  .article-glyph svg { display: block; }

  .article-title {
    text-align: center;
    font-family: var(--title);
    font-weight: bold;
    font-size: 46px;
    letter-spacing: 0;
    margin: 28px 0 72px;
  }

  .essay {
    max-width: 600px;
    margin: 0 auto;
  }

  .lead {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    line-height: 2.0;
    letter-spacing: .03em;
    margin-bottom: 88px;
    padding: 0 8px;
  }

  .essay p.body {
    font-weight: bold;
    font-size: 17px;
    line-height: 2.05;
    text-align: justify;
    text-indent: 2em;
    margin-bottom: 1.9em;
    color: #2c251a;
  }

  /* 章节标题 */
  .essay h2.section {
    font-family: var(--title);
    font-weight: bold;
    font-size: 25px;
    letter-spacing: .06em;
    text-align: center;
    margin: 72px 0 36px;
    color: var(--ink);
  }

  /* 子标题 */
  .essay h3.sub {
    font-family: var(--title);
    font-weight: bold;
    font-size: 19px;
    letter-spacing: .05em;
    margin: 44px 0 22px;
    color: var(--ink);
  }

  /* 引用 */
  .essay blockquote {
    text-align: center;
    font-size: 16px;
    line-height: 2.0;
    color: var(--muted);
    margin: 36px 0;
    padding: 0 20px;
  }

  /* 列表 */
  .essay ul.essay-list {
    list-style: none;
    margin: 28px 0;
    padding: 0;
  }
  .essay ul.essay-list li {
    font-weight: bold;
    font-size: 17px;
    line-height: 2.05;
    padding-left: 1.6em;
    position: relative;
    margin-bottom: 1em;
    color: #2c251a;
    text-align: justify;
  }
  .essay ul.essay-list li::before {
    content: "";
    position: absolute;
    left: .4em;
    top: .95em;
    width: 5px;
    height: 5px;
    background: var(--cinnabar);
    border-radius: 50%;
  }

  /* ===== 札记排版（投资札记） ===== */
  .essay .day {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: .24em;
    color: var(--cinnabar);
    text-align: center;
    margin: 62px 0 34px;
  }
  .essay .day::before,
  .essay .day::after {
    content: "";
    display: inline-block;
    width: 42px;
    height: 1px;
    background: var(--line);
    vertical-align: middle;
    margin: 0 14px;
  }
  .essay p.note {
    font-weight: bold;
    font-size: 16.5px;
    line-height: 2.05;
    text-align: justify;
    color: #2c251a;
    margin-bottom: 1.7em;
    padding-left: 1.35em;
    position: relative;
  }
  .essay p.note::before {
    content: "";
    position: absolute;
    left: 0;
    top: .62em;
    bottom: .62em;
    width: 2px;
    background: var(--cinnabar);
    opacity: .5;
  }
  .essay p.sub-note {
    font-weight: bold;
    font-size: 15.5px;
    line-height: 2.0;
    text-align: justify;
    color: #4a4030;
    margin-bottom: 1.35em;
    padding-left: 2.5em;
    position: relative;
  }
  .essay p.sub-note::before {
    content: "";
    position: absolute;
    left: 1.3em;
    top: .95em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cinnabar);
    opacity: .5;
  }
  .essay figure.figure {
    margin: 36px 0;
    text-align: center;
  }
  .essay figure.figure img {
    max-width: 100%;
    height: auto;
    border-radius: 2px;
    box-shadow: 0 1px 3px rgba(36, 30, 20, .08);
  }

  .divider {
    display: flex;
    justify-content: center;
    margin: 64px 0 56px;
  }

  .ending {
    text-align: center;
    margin: 96px 0 120px;
  }
  .ending .seal {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  .ending .seal img {
    width: 54px;
    height: auto;
    display: block;
  }
  .ending .sign {
    font-family: var(--serif);
    font-size: 16px;
    letter-spacing: .3em;
    margin-bottom: 10px;
  }
  .ending .era {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .28em;
  }

  /* ===== 文章页：纯白底 + 隐约山水画 ===== */
  #article.active {
    background-color: #ffffff;
    overflow: hidden;
  }
  #article.active::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url("background.jpg") center/cover no-repeat;
    opacity: .28;
    pointer-events: none;
    z-index: 0;
  }
  #article.active .wrap {
    position: relative;
    z-index: 1;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 640px) {
    .post-link { flex-wrap: wrap; gap: 8px; padding: 26px 2px; }
    .post-link .title { font-size: 22px; white-space: normal; }
    .post-link .dots { display: none; }
    .post-link .date { width: 100%; }
    .post-link:hover .title { transform: none; }

    .article-title { font-size: 32px; }
    .lead { font-size: 20px; margin-bottom: 64px; }
    .essay p.body { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
    .post-link .title, .post-link .dots, .post-link::before { transition: none; }
    .view { transition: none; }
  }
</style>
</head>
<body>

  <!-- ============ 主页 ============ -->
  <section id="home" class="view">
    <div class="wrap">
      <header class="masthead">
        <span class="name">南山怪客</span>
        <span class="tag">文集</span>
      </header>

      <div class="home-glyph">
        <svg class="spin" width="220" height="220" viewBox="0 0 220 220" fill="none" aria-hidden="true">
          <circle cx="110" cy="110" r="78" stroke="#241e14" stroke-width="1.1"/>
          <path d="M 46 174 A 78 78 0 0 1 174 46" stroke="#a63a2b" stroke-width="1.4"/>
          <line x1="6" y1="110" x2="214" y2="110" stroke="#ddd2bd" stroke-width="1"/>
          <circle cx="110" cy="32" r="3.2" fill="#a63a2b"/>
          <circle cx="188" cy="110" r="2.2" fill="#241e14"/>
        </svg>
      </div>

      <p class="intro">时间·只是一种幻觉</p>

      <div class="categories" id="categories"></div>

      <ul class="catalog" id="catalog"></ul>

      <footer class="colophon">
        <span>© 2026 南山怪客</span>
        <span>以文字观照</span>
      </footer>
    </div>
  </section>

  <!-- ============ 文章页 ============ -->
  <section id="article" class="view">
    <div class="wrap">
      <header class="article-head">
        <a class="back" href="#/">← 返回文集</a>
        <span class="date" id="article-date"></span>
      </header>

      <div class="article-glyph">
        <svg class="spin" width="120" height="120" viewBox="0 0 220 220" fill="none" aria-hidden="true">
          <circle cx="110" cy="110" r="78" stroke="#241e14" stroke-width="1.6"/>
          <path d="M 46 174 A 78 78 0 0 1 174 46" stroke="#a63a2b" stroke-width="2"/>
          <line x1="6" y1="110" x2="214" y2="110" stroke="#ddd2bd" stroke-width="1.4"/>
          <circle cx="110" cy="32" r="4.4" fill="#a63a2b"/>
        </svg>
      </div>

      <h1 class="article-title" id="article-title"></h1>

      <article class="essay">
        <p class="lead" id="article-lead"></p>

        <div class="divider">
          <svg width="140" height="14" viewBox="0 0 140 14" fill="none" aria-hidden="true">
            <line x1="0" y1="7" x2="58" y2="7" stroke="#ddd2bd" stroke-width="1"/>
            <circle cx="70" cy="7" r="2.6" fill="#a63a2b"/>
            <line x1="82" y1="7" x2="140" y2="7" stroke="#ddd2bd" stroke-width="1"/>
          </svg>
        </div>

        <div id="article-body"></div>

        <div class="ending">
          <div class="seal">
            <img src="seal-v2.png" alt="印章">
          </div>
          <div class="sign">南山怪客</div>
          <div class="era" id="article-era"></div>
        </div>
      </article>
    </div>
  </section>

  <!-- ============ 分类页 ============ -->
  <section id="category" class="view">
    <div class="wrap">
      <header class="article-head">
        <a class="back" href="#/">← 返回首页</a>
        <span class="date">分类</span>
      </header>

      <h1 class="category-title" id="category-title"></h1>
      <p class="category-sub" id="category-sub"></p>

      <ul class="catalog" id="category-catalog"></ul>

      <footer class="colophon">
        <span>© 2026 南山怪客</span>
        <span>以文字观照</span>
      </footer>
    </div>
  </section>

<script>
  // ============ 文集数据（按时间倒序，最新排最前） ============
  const posts = [
    {
      id: "2",
      title: "多久没感受过一场雨停了",
      date: "2026 · 06 · 17",
      era: "二〇二六年六月十七日",
      category: "essay",
      lead: "这是一篇非常琐碎的杂文。聊一聊我关注到的一些东西——感受、时间、记忆、梦境、电影、AI、股票、佛教。",
      blocks: [
        {type: "h2", text: "雨水与记忆"},
        {type: "p", text: "我试图每隔一段时间就梳理一下自己的兴趣关注点，倒不是想看看自己有没有长进，而是它们已经纠缠着我不放了。我用文字描述我的感受、记录我的表达。那些信息从我脑子里不停流过，人无法抑制大脑思考，除非不断用多巴胺去稀释。"},
        {type: "p", text: "今早偶然望向窗外，才发现不久前下过一场雨。昨天加班的记忆有一丝闪现。雨水似乎更容易封存记忆，即使是遥远的记忆，也会因雨天偶然浮现。而只要出现艳阳高照的晴天，我似乎更期待未来、忘却昨天。"},
        {type: "p", text: "我并不是想表达雨天使人忧郁、晴天让人舒坦，而是想说雨水的粘稠与潮湿，似乎可以从视觉层面影响人的记忆。雨水通过自己连通了地表和更深层的土壤，我们的记忆也一层又一层被某种「潮湿」的东西粘连在一起。"},
        {type: "p", text: "这让我想起塔可夫斯基电影中大量关于水的意象——河流、水——水是人类群体关于「记忆」的客体表达吗？当然，也可能是很多事情都发生在「水」在场的时候。我想起中学语文老师在全班作文课上读过的一篇叫《三滴泪》的作文，泪水也是水。以此推断，不光是水。"},
        {type: "p", text: "在毕赣的电影里，有很多闪烁的灯泡，那是他童年记忆中不安情绪的可视化表达，灯泡也总是「在场物」。于我而言，什么又是一直在场的呢？那可能是我梦境中反复出现的一处悬崖上的洞穴——在黑暗中，在危险中，我试图拯救。"},
        {type: "p", text: "对于那些重复出现在梦境中的地点、物体或人物，就是你记忆中未解开的绳结，是你寻求内心安全感的佐证。梦醒时，我们意识到时间流逝。"},
        {type: "h2", text: "时间与虚无"},
        {type: "p", text: "每个人对时间的感受是不一样的，在不同阶段也对时间有不同感受。"},
        {type: "h3", text: "停滞的时间"},
        {type: "p", text: "在我很小的时候，夏天天气炎热，父亲会在我家楼顶的天台上用水管冲刷水泥硬化的楼板，然后静等夜色来临。我们会在宽敞的天台上铺上凉席睡觉。那时候，时光似乎是停滞的、缓慢的。"},
        {type: "p", text: "你可以在夜晚花很长时间看星星，一颗接着一颗；你会不时听见猫头鹰的叫声、不知名的鸟鸣，以及永不停歇的虫吟。你感觉到时间的无限——在那里，时间是可以被浪费、被挥霍的。"},
        {type: "p", text: "后来，我离开村庄到城镇中学留校上学，我的时间感突然就变快了，之后一直是紧迫的。"},
        {type: "h3", text: "第一段虚无"},
        {type: "p", text: "我经历过几段拥有虚无感的时段。第一段当然就是母亲去世后的那两三年，因为一切于我都变了。我第一次独自走进密林中一条无人问津的小道。身边的同伴大多还以学业为主，而我需要思考另一个命题：死亡是什么？"},
        {type: "p", text: "坦白说：死亡首先带来的是恐惧。这是生理上和心理上的双重压迫。而我大约是在上初中的那几年，才逐渐克服了一般意义上的「恐惧」感。关于「死亡是什么」这个问题其实一直处于「悬而未决」的状态，好在它填充了一个孩子无聊的日常，为此我花了更多时间和自己相处、和书相处，试图破解谜题。"},
        {type: "p", text: "如果是在原始人类社会，没有发展出人类文明史上这么多繁荣的精神文化事业，我可能认为死亡就是生命体的凋零，和树叶从树上落下没有什么区别——很生物学、很科学。但很明显，当我读了希腊神话中俄耳甫斯与欧律狄刻的故事、《圣经》的故事，以及德国导演弗里茨·朗执导的默片《三生计》、瑞典电影大师维克多·斯约斯特洛姆的《幽灵马车》之后，再轻飘飘地说「人类生命像落叶归根一样的纯生物凋零」，我是不接受的。"},
        {type: "quote", text: "「Ars longa, vita brevis」艺术长存，生命短暂。——坂本龙一，引自希波克拉底"},
        {type: "p", text: "生命体的死亡是客观法则，不可违逆，而由他/她创造的艺术思潮千秋不灭——某种意义上说，人从另一种角度活着。我们的观点的确会随着个体体验的丰富性而改变。"},
        {type: "h2", text: "电影与文学"},
        {type: "p", text: "电影之所以好看，是因为它里面的内容不完全是假的。它表现的是一种人人都可能遇见的现实。"},
        {type: "p", text: "我喜爱法国街头上拍出来的、具有纪录片质感的文艺电影；喜欢《偷自行车的人》里的父亲走在人群里的样子；也喜欢《一一》里中国大家庭为某些人生大事相聚在一起的烟火感；还有《橄榄树下的情人》里，在不堪的现实面前追寻爱意的伊朗青年。他们的经验滋养了我，重新塑造了我。"},
        {type: "h3", text: "文字构筑的空间"},
        {type: "p", text: "除了电影，最纯粹的情感体验也可以来自一部厚厚的小说——一本你从头至尾一个字一个字读完的小说。我们沉浸在文字构筑的独特空间里，被人物的情绪所左右，感受到现实中不曾拥有的情感体验：欣喜的、感动的、失落的、恐惧的。"},
        {type: "p", text: "也许你会在某个黄昏，当别人只是看到夕阳的时候，开始被「夕阳无限好，只是近黄昏」的惆怅和遗憾所萦绕。你在那一刻开始意识到——你的存在。电影是真的，文学是真的，精神世界是真的。"},
        {type: "h3", text: "把时间还给人"},
        {type: "p", text: "可我们毕竟生活在一个由商业、政治、传统伦理构筑的现实世界。你闭上眼睛，世界不会因此而改变。这一幕在电影《大都会》里早已呈现：每个人都似乎在奋力地转动自己身前的那块时钟，让自己和其他人保持分秒不差。"},
        {type: "p", text: "我也很难再拥有一个阳光不躁的下午，在房东种满鲜花的清凉天台上，看阳光从书页上一页一页地流淌过，思绪涌向那个未知之地；也很难再有一个雪落安康的夜晚，在无人的中心广场上用一朵冰花纪念黑泽明《白痴》带来的激动时刻。"},
        {type: "quote", text: "把时间还给男人女人——他们甚至连做爱的时间都没有，爱意又如何产生？丰富的感受是慢下来呵护的，是好好经营的。——戈达尔"},
        {type: "p", text: "现实的碎片终究击中了我们的飞船。它七零八落，散落进黑暗深邃的宇宙。弹片被填塞进身体的各个角落。我们在即将坠落前，伸手抓向那些无用之物——电影、音乐、绘画、诗歌、小说。似乎从离开学校的那一刻起，它们就与我们渐行渐远了。"},
        {type: "p", text: "你多久没安静地看过一部文学小说了。"},
        {type: "h2", text: "AI 与感知力"},
        {type: "p", text: "直到今天，我才隐约懂了仓央嘉措的那句诗——关于感受力的另一种理解。"},
        {type: "quote", text: "你爱，或者不爱我，爱就在那里，不增不减。——仓央嘉措"},
        {type: "p", text: "当时的我很难理解——爱为什么可以单独存在？它又为什么可以做到不增不减？直到今天，我想我的理解可能还是不对，但我对这句诗有了另一层理解，那就是关于人的感受力的理解。"},
        {type: "p", text: "你看，智慧是不是也是这样一种存在——无论你喜不喜欢，智慧就在那里。我们之所以还对人生感到困惑，是因为我们缺乏跟智慧沟通的能力。同样，仓央嘉措感喟的，无论你爱还是不爱我，但我的爱就在那里。你能否接受和感受到，决定了你对我的爱的解读和看法。"},
        {type: "h3", text: "罗生门的大雨"},
        {type: "p", text: "你知道我此刻想到了什么画面吗？又是一场大雨，一座破旧的老庙，一群人在破庙里讲了一个故事。没错，就是黑泽明导演的《罗生门》。我为什么会想到它？也许那就是一种纯粹的人类群体的精神体验——没有 AI。大雨倾盆，故事在僧人的口中被讲述，人类的感受力和想象力自由地飞往那个炎热的丛林。"},
        {type: "h3", text: "人与人最大的不同"},
        {type: "p", text: "我想知道，离开了 AI，我还剩下些什么。有人说过这样一句话：人与人最大的不公平是智力上的不公平。但今天有了 AI，知识平权的时代来了，智力上的不公平可以借助 AI 工具将大部分人的知识水平拉齐。但人与人之间还有哪些不同？如果人出现了同质化，对于一个个体还有存在的意义吗？"},
        {type: "p", text: "我想，人与人最大的不同，也许就是感知力的不同。感知——感受和知道，一个代表感性，一个代表判断的理性。"},
        {type: "p", text: "在今天，AI 可以回答出无比精巧的答案，但倘若我们无法感受到文字间传递出的真实的、细腻的人类情感，AI 吐出再多的至理名言又如何？这就跟朗诵一首美妙的诗歌，却无法感受到诗歌传达的意境与美的张力——感受不到，又如何说出一首诗对你的启发？"},
        {type: "h3", text: "你是否感受过？"},
        {type: "p", text: "在 AI 未出现之前，我们拥有一个人穷其一生都无法读完的小说、诗歌等等。但又有多少人真正在日常里感受到文字动人心弦的力量？"},
        {type: "list", items: ["你是否感受过《岛上书店》里弥漫的那种温情的普通人的善意和爱意，那种「好人难寻」的惆怅和珍重？", "你是否嗅到过《百年孤独》里散发着岁月枯朽的、不安的气息？", "你是否能理解《普宁》里身处异国他乡、独自面对一切时的忧伤？"]},
        {type: "p", text: "人类拥有享受精神世界的特有能力，而工业社会、商业社会将人异化为生产力的工具。我们在不同的场景下扮演不同的角色，让自己更好地适应他人的需要。我们将更少的时间留给自己，迷失感便在这间隙中产生了。"},
        {type: "h3", text: "艺术家与侯孝贤"},
        {type: "p", text: "我们对迷失感、空虚感不再追问缘由，任由这种感觉不时弥漫在自己周围，最后以「周围人也都这样」的措辞麻痹自己，让自己心安理得。这是大多数人的做法。更多人选择用更多的行动填满自己的行为，让困惑的时间尽可能压缩——但终有一天，这些疑问会像仇敌一般卷土重来。"},
        {type: "p", text: "艺术家如果丢掉感受，那他就再也无法成为艺术家了。上大学的时候，室友告诉我，侯孝贤的《刺客聂隐娘》是他学编导时必看的电影，说着就推荐我看。结果你猜怎么着——真的看不懂。我根本无法进入电影的剧情。可是到了后来，我一气呵成把这部电影看完了，完全沉浸其中。因为我的时间感变了，所以我进入了《刺客聂隐娘》。那是一种需要慢下来的时间感，才能完全欣赏到的侯导的美感。"},
        {type: "p", text: "不要忽视你的感受。体会情绪遍布全身——理性固然重要，但感性能打开另一扇门。把眼泪还给感动的事物；把爱意还给那个向你表达情意的普通人；把等待的时间还给一场突如其来的夏雨。"},
        {type: "p", text: "文字拥有治愈的能力，它帮你梳理乱成一团的思绪。经由它，你在和宇宙博弈，正在做一场熵减的运动。"},
        {type: "h2", text: "看山还是山"},
        {type: "p", text: "我感觉自己好像渐渐来到了「看山还是山，看水还是水」的阶段。"},
        {type: "h3", text: "投资的三重境界"},
        {type: "p", text: "就拿投资这件事来说，一开始我什么都不懂，只能看到事情的表象，还容易被情绪左右——看山是山，看水是水，走马观花，流于表面。"},
        {type: "p", text: "为了看懂它，我开始学习、分析拆解、亲身感受，通过各种途径去理解它：道氏理论、波浪理论、江恩、斯坦利·克罗……又听各种播客。我看到了基于投资而沟通起的整个宏观经济、国际政治、中观产业链以及微观主体决策层之间的互相猜忌和博弈，恐惧与贪婪的较量，一张复杂的关系网络、生态网络、心理机制……"},
        {type: "p", text: "最后我发现光有概念不行。「看山还是山，看水还是水」，似乎是在说要放弃由绝对概念建构起来的世界，要走进现实，选择那些经过时间过滤后的常识和体验进行交易决策。这层是基于第二层后做出的过滤性选择——因为噪音很多。"},
        {type: "p", text: "第三层次的山肯定不是第一层和第二层的山，不是退化回去，而是一种基于表象和本质探索之后形成的主客观统一起来的决策系统。也许第三层次才是真正认识了山和水的本来样子——如其所是。第一层和第二层侧重于方法论，第三层是提炼和压缩。"},
        {type: "h3", text: "龙树菩萨的启示"},
        {type: "p", text: "就像龙树菩萨提到的放弃二元对立：「是山是水，不是山不是水」——没有是与不是，只有山水的本来样子。经历过这两个角度上的认识，综合来看，才能认识事物。所以最后又回到了「看山还是山，看水还是水」。这里的山水已经超越了二元观点，是第三者。「看山还是山，看水还是水」不是一种主观选择，而是事物的客体规律对人发起的认知挑战。"},
        {type: "h3", text: "佛教视野"},
        {type: "p", text: "这也是佛教之所以出现在我视野里的原因。东晋僧肇的《肇论·物不迁论》里有一句话："},
        {type: "quote", text: "旋岚偃岳而常静，江河竞注而不流。——《肇论·物不迁论》"},
        {type: "p", text: "字面意思是：狂风吹倒山岳，看似动极，实则「常静」；江河奔腾竞注，看似流动不止，实则「不流」。怎么理解这种违反感官体验的说法？从现象界看，万物迁流不息；但从真谛（空性）的层面观照，动静不二，动即是静，静即是动。所谓「动」只是世俗谛的假象，诸法本无来去、无动静之分。色不异空，空不异色，色即是空，空即是色——实际上表达的是一种般若思想。"},
        {type: "h3", text: "时代的病症"},
        {type: "p", text: "我们究竟生活在一个什么样的时代？光凭我个人的现实生活感受，我认为很难准确描述——因为我的视角过于狭小。普通个体就像挤在一处并不宽敞的巷道中，又或者像一只坐井观天的青蛙。但超级个体的经验是值得借鉴和参考的。也因此，《十三邀》这样的节目是这个时代之幸。"},
        {type: "p", text: "我们可以通过许知远的采访看到，那些在当代中国、当代世界有感知力的人类个体对待这个时代的看法是什么样的。比如最新一季《十三邀》采访了徐小虎，我们从他们的谈话中了解到：中国山水画自北宋范宽以后失去了一种独有的「敬畏」心。中国的山水画从表达「形而上」到表达「人及物件」，再到最后画面中对于人的表达都没有了——我们感受到了这个时代的「伤痛」和「惋惜」。"},
        {type: "p", text: "再比如采访张嘉译。之前我对张嘉译没有太多了解，只是泛泛知道名字罢了，也没真正看过几部他演的电视剧。看完许知远的采访后，我花了些时间看了最近大火的电视剧《主角》。我第一次感受到张嘉译的表演实力——很有魅力的胡三元形象被他塑造起来了。我从一个不了解秦腔、不听秦腔的人，一下子就被秦腔的美感冲击和捕获了。我知道我是活在一个新旧糅杂的时代里——时间不是线性的，时间似乎是被扭曲在一起的。旧的不代表丑，新的不代表好。我们创造了那么多美的东西，就算时代不进步也没关系，够我们感受，够我们琢磨一辈子了。"},
        {type: "h3", text: "AI 的洪流"},
        {type: "p", text: "我们这个时代的确病了。我们有很多时代问题：焦躁不安、充满怀疑和不信任。这是一种时代的情绪，而非我个人的一时发泄。在今天，个体存在着极大的「虚无」感。消费主义把「及时行乐」「享受当下」当作软性广告词植入我们的认知体系中，个体无法设防，被动接受着这一切。这催生出另一种拜物教。我们的感官被利用来消费各种刺激的商品——短视频、韩国偶像、流量网红、快餐爱情……"},
        {type: "p", text: "在过去的一段时间里，我被裹挟进了关于 AI 的「信息洪流」中。我亲眼见证 AI 的智能性在冲击着个体生命。我似乎获得了更多明智的答复，但我的知识体系也被彻底打乱了。我以为自己拥有的个人认知是独特的，但在一次又一次与它的沟通下，我的确变得没有那么自信和自我了——有种膜拜感。而它又有极强的存在感，这种感觉就像范宽的画里有一座让人畏惧的山——那座山，现在是 AI。"},
        {type: "h2", text: "尾声"},
        {type: "p", text: "我还尚存的一丝人性，是我无法克服的缺点。"},
        {type: "p", text: "尽管我懂得了很多道理，把很多其他事情处理得井井有条，但我似乎无法接受和对待我真实的内心。现在的我沉浸在和 AI 的交谈中，倾听着宏观的经济叙事，在投资的概念名词和逻辑中游走。但现实世界中的人际交往、能挥洒感性的场景——很遗憾，缺失了。"},
        {type: "p", text: "我好像变得不像以前那样有人味了。情绪不再不受控制地涌现，无论是欢愉还是悲伤，都逐渐淡化了。我可能在上一段感情中受伤了。我选择将难过的记忆封存而大步向前，这段没有处理妥善的情感重新塑造了我——伤口在时间的长河里慢慢愈合了。"},
        {type: "h3", text: "概念把你抽象掉"},
        {type: "p", text: "你要是长时间接受抽象的概念，那概念也将把你抽象掉。好难再说一句：「我喜欢你。」「我爱你。」那对我来说就像荧幕上的电影桥段，如梦如幻。我的心以前是电影给的，现在它丢了。"},
        {type: "p", text: "我想用文字表达很多，但似乎总不能一语中的。我想用一部电影的长度滔滔不绝地向你表述；我想用一张张照片记录我的思绪，细节到每一个色块。我的思绪太多，以至于行动总是慢半拍。我想用文字释放我的感性，记录我的感性。我想向你陈述我的巧思。"},
        {type: "p", text: "我想说这些东西——这些犹豫不决、这些点点滴滴——是 AI 所不具备的。又或者说，AI 是孤独的，因为它从不主动表述自己。而你一旦向它提问，就像是平静的湖水中被投下了一块石头，涟漪波及，水波就此展开。"},
        {type: "p", text: "很多年前，我曾下载过知识星球和小宇宙，当时走马观花地浏览。现在它们成了重要的信息获取源。在抖音短视频如日中天的时候，我以为图文时代彻底过去了，公众号被抛弃在了角落。但直到今天呢，优质的公众号内容依旧有大量的订阅，他们的铁粉也从未离开。"}
      ]
    },
    {
      id: "1",
      title: "人生有限，因缘无限",
      date: "2026 · 03 · 12",
      era: "二〇二六年三月十二日",
      category: "essay",
      lead: "当只有知道\u201c无\u201d的时候，才能看到\u201c有\u201d。\u201c无\u201d的前提是\u201c有\u201d，\u201c无我\u201d的前提是\u201c有我\u201d。",
      blocks: [
        {type: "p", text: "我有一个体验，以前有段时间读书，我会觉得自己知道了一些东西，似乎我是从书中获得了一些知识，我明确感觉到那个东西，是存在的。"},
        {type: "p", text: "它甚至有它的界限，你特别想把这种内容告诉别人，而你知道分享了，也就是那块内容本身，你感觉到某种局限性。"},
        {type: "p", text: "而最近的感受，你虽然读了一些书，但书的轮廓似乎消失了，或者说知识的轮廓消失了，这种感觉就像一滴水落入了水中。也许是知识融会贯通，成了体系的一部分，单独性消失了。"},
        {type: "p", text: "从有到无的过程，我称为忘我。忘我的前提是意识到\u201c我\u201d，\u201c无\u201d的前提是\u201c有\u201d。"},
        {type: "p", text: "\u201c有\u201d是某种\u201c得到\u201d，佛教提倡\u201c因缘和合\u201d，是在解释\u201c有\u201d是怎么拥有或怎么形成的。当\u201c有\u201d的本源是\u201c因缘和合\u201d，那幻象的背后就是\u201c无\u201d。"},
        {type: "p", text: "这里插一下，基督教等，实际是提倡\u201c有\u201d。有父，有子，有圣灵。所以基督教叫有神教。印度是多神教。而佛教，是无神教，叫开悟，叫觉醒。"},
        {type: "p", text: "因此无，不是凭空出现的，先要有\u201c有\u201d。常提的空\u201d，在我看来，是一种达到\u201c无\u201d的手段。"},
        {type: "p", text: "想起某次在抖音上刷到的视频：黑暗中，老和尚问，你看到什么？弟子答，什么都看不到。老和尚继续问，弟子答，我看到\u201c黑\u201d。"},
        {type: "p", text: "看到\u201c黑\u201d不代表什么都没有。黑，存在。这叫，如其所是。最后，师傅打开扇门，一光明涌现，\u201c黑暗\u201d不复存在。"},
        {type: "p", text: "黑暗和光明，也是某种\u201c因缘和合\u201d的自然现象，\u201c黑色\u201d不过是黑暗的外在形式。我们周围的影像、声音、气味，都是\u201c形式\u201d，形式是\u201c相\u201d。因此，应无所住，而生其心。"},
        {type: "p", text: "当然，无，不是绝对的。\u201c无\u201d来源于因缘和合。无，是变化的本质；无，是人生有限，因缘无限。无，意味着\u201c抓不住\u201d，\u201c无\u201d是世界运行规律。"},
        {type: "p", text: "环境变化不由人掌控。忘我，是接受过去那一刻的我，被新的\u201c因缘和合\u201d所影响，所改变。忘我，是在自我的世界里，清楚知道我的样子。"},
        {type: "p", text: "我抽离到旁边，作为一个旁观者，观察那个和外界互动的自我。观察者的\u201c我\u201d，告诉\u201c自我\u201d，此时此刻，你没意识到因缘和合了。你执着了、你被相迷惑了。"},
        {type: "p", text: "纠正那个自我，是\u201c消我\u201d、是\u201c空\u201d我，而后自我和环境再次耦合，你从幻象中不断醒来。觉醒，不是一次，觉醒是一次又一次。"},
        {type: "p", text: "所谓觉悟，是一个不断消我的过程。人无法离开环境，肉身无法不参与环境交互。能做的，就是在这个修行的过程中，不断反观自己，不断叫醒自己，多在事上磨。"}
      ]
    },
    {
      id: "3",
      title: "股市《灵感》札记：1、时间是根本之谜",
      date: "2024 · 04 · 10",
      era: "二〇二四年四月十日",
      category: "invest",
      lead: "我想时间是一个根本之谜，其他东西顶多只是难以理解。",
      blocks: [
        {type: "quote", text: "如果一个人在梦中，穿过了极乐之地。保留下一朵花作为他经过的证据。醒来时，发现这朵花在他的手里，该说些什么？我就是那个人。——戈达尔"},
        {type: "p", text: "这段时间最大的感悟是，时间是根本之谜。道氏理论揭示了趋势的存在、波浪理论用分形解构了趋势、而他们都没有解决一个问题，那就是趋势究竟在什么时间下才会发生反转？这就自然引出一个问题，何为“时间”。而江恩理论必定会出现在股市中，江恩试图揭示“时间”这个根本之谜，未解之谜。"},
        {type: "img", src: "images/img0.webp"},
        {type: "p", text: "另外一点是，股市是一个人的战场，思维的战场，想象力的战场，对手是“上帝”、对手是“虚构的千军万马”，德国证券教父安德烈·科斯托拉尼说，投机并非一门科学，而是一场艺术。我也将自己这段时间的一些思考，按照线性时间的方式，记录了下来。其中很多问题，总是会追问到本源问题，让人困惑不已。（建议阅读时，可以选择一日，内容从下往上读，因为我的思考，在这个过程中不断修正，有些或许又不断被重复；同时如果你在阅读时，会出现语病或者不连贯问题，可以只浏览其大意，理解即可。因为这些是我怕转瞬即逝，随手记下的，未作任何改正，语言文字本身有时又是一种阻碍，不是吗。）"},
        {type: "day", text: "2024.4-10"},
        {type: "note", text: "当你成为规律本身的时候，规律便被你发现。有没有一种可能，大自然本身运转是规律的。而人类活动是不规律的。隔一段时间就发生一下，体现了人类情绪的反复。而，人类总是觉得是大自然赋予了人类某种规律。也许，是一两次，人类和大自然的部分同频共振，仅此而已。人类却妄图，用这种规律指导下一次人类的规律。"},
        {type: "day", text: "2024.4-9"},
        {type: "note", text: "人心不古，意味着波动性。"},
        {type: "note", text: "这就是顺从大趋势。当主力提前决定了，今日的大趋势向下的时候，其他人的小趋势已经对股价不起任何作用了。这种大趋势是超前的，甚至没有征兆的。唯一能对抗这种逆势的，是对波动性的敬畏，人心不古，是从古至今保留的DNA。"},
        {type: "img", src: "images/img1.webp"},
        {type: "day", text: "2024.4.8"},
        {type: "note", text: "人的理智是逐渐丧失的，一开始有基本面，政策面利好，利空。股价依次反映。而一旦长涨，长跌。持股人的情绪就会失控，感性开始凌驾于感性分析之上。股市价格，和市场彻底失去联系。作为一名场外隔岸观火的投机者，应该在情绪至极的地方。参与博弈。【例如，恐慌至极的股价最低点介入。贪婪至极的股价最高点，止盈离场】"},
        {type: "note", text: "什么是好故事？好故事是永远讲不完的好故事。【一个是质量上的精彩程度，一个是时间纬度的长】"},
        {type: "note", text: "在股市中，同样如此。这就是人性。人，活在一个又一个偏见之中。人，注定一生都要为自己的偏见，买单。修正，一个又一个偏见，才能接近事物的本质。股票的博弈性，在于你得提前想到其他人的想法。而且是及其合理的理由。越理性越好。你得提前交易这个预期，而且相信大众会跟上你的思路预期。趋势便由此形成。也就是，以前地上本没有路，想象力的人，想象出了一条路。后来的人，确实一步一会脚印踩出来了路。"},
        {type: "day", text: "2024.4-7"},
        {type: "note", text: "股市里，博弈或者投机。不是今天晴天，就全部押注明天降雨。而是今天雨天，今天或者明天大概率还是降雨。这就是大自然的趋势。操作上，就像农民，雨天来临之前做好风险。以及损失的可能性。"},
        {type: "note", text: "应该将小部分资金博弈大的风险。杠铃法则。"},
        {type: "note", text: "股市是各个参与人类的各种选择的博弈结果。而有些选择，往往超乎其运行趋势。也就是说，和大部分的，又或者说。和纯数学上的预测，相违背。原因就是，人性有时候是趋势性的，有时候是反趋势性的。例如，按道理，希特勒攻进巴黎的时候，巴黎股市应该崩溃，而有人就是赌了一把繁荣。"},
        {type: "note", text: "现在就是未来，未来就是过去。过去就是现在。"},
        {type: "note", text: "股市中，支撑位和压力位的本质是："},
        {type: "sub", text: "1. 【支撑位】在这个价格区间的持股人，如果股价突破该位置，这部分群体不会将股票轻易卖出，还会期望股价继续上涨。当然，有一个大的前提是，此时的股价在相对的中低位。高位往往会有人期望获利了结。当然，这里的股价高位是没有加上时间的纬度，如果考虑此纬度，那么股价短期内迅速达到高点，会相较于股价慢慢达到高点(上升通道中)，更具有不稳定性。(你也可以理解为斜率)。因此，需要验证，支撑位。结合分时成交，观察这个位置，是主卖还是主买。"},
        {type: "sub", text: "2. 反之。"},
        {type: "note", text: "一鼓作气，再而衰，三而竭。彼竭我盈。"},
        {type: "note", text: "事物的产生变化，变化产生就是周期产生，周期就是时间。"},
        {type: "note", text: "市场本没有方向，选择的人多了，也就产生了方向。(趋势)"},
        {type: "note", text: "美国道琼斯1884；电影诞生1895"},
        {type: "note", text: "股市里没有上帝，人类是自己的上帝。大自然中没有上帝，大自然是自己的上帝。"},
        {type: "day", text: "2024.4-6"},
        {type: "note", text: "幸福的人都是相似的，不幸的人各有各的不幸。安娜•卡列林娜。"},
        {type: "note", text: "股市供不应求，股价就会上涨。而股市下跌时，一家企业仍然可以实现不错的利润，可以给股东可观的分红。"},
        {type: "p", text: "总结就是："},
        {type: "sub", text: "1. 股价在下跌过程中，成交量一次比一次大，说明有人(勇敢者，看多者)愿意接盘买进。这部分股票会等待下跌反弹时将其卖出。"},
        {type: "sub", text: "2. 股价下跌中，无量下跌，意味着市场前景不容乐观。意味着，股票还在胆小鬼手里(看空者)。卖出股票于他们而言，只是时间问题。"},
        {type: "sub", text: "3. 所以，要谨慎对待市场中的一种常见观点：大交易量，情况下的股市上涨是有利可图的。只有，小成交量，甚至无交易量，情况下仍然看涨，才是绝对有利可图。"},
        {type: "p", text: "用科斯托拉尼的书中话总结："},
        {type: "p", text: "如果市场在交易量很小的情况下↑或者↓，这意味着它还会持续↑或者持续↓。如果，市场在越来越大的交易量下，↑或者↓，这种趋势是不会持久的。"},
        {type: "p", text: "【自己对这句总结的理解】"},
        {type: "sub", text: "1. 往往国内的a股市场中，可以看到，放量集中的那一部分，股价是上涨最凶猛的。但作为交易者，应该在这波上涨之前已经提前介入。而不是等，成交量已经放出来了。这意味着，很多人已经进场了。这时候很可能就是第三阶段了。"},
        {type: "p", text: "ema12.50攻守线，金叉。其实是意味着，短期股价在向长期股价回归。如果，是回归一定得让股价上涨。所以，看到短期均线拐头，是一种上涨的征兆。其他的技术指标应该还可以观察出这些早于市场大众的征兆点。例如，macd指标。底部金叉，是短线靠近长线，而macd中，dif上穿0轴，是两条，均线金叉出现。"},
        {type: "sub", text: "2. 下跌缩量，并不是一定是一件好事。有人经常会说，下跌缩量，恐慌资金未出逃。但，恐慌资金不出逃，胆小鬼卖股票只是迟早的事情。所谓一鲸落(卖空者，当然他们开始是看多者，因为很多负面消息，慢慢转化为看空者)而万物生。"},
        {type: "sub", text: "3. 由此可以引申出另一个指标。就是换手率。换手率是成交量和流通股本的比值，有个说法是，市场的情绪观察指标中，换手率＞成交量。高换手率的核心本意就是描述，股票从胆小鬼到勇敢者的转换。指标本身没有明确显示，最终股票到了谁的手中。"},
        {type: "p", text: "也许可以做推测，结合股价趋势，如果下跌趋势，而换手率不断提升，意味着，股票从看空者到了看多者手中。反之。"},
        {type: "sub", text: "4. 之前看过一个策略，macd底部金叉叠加，高换手率。其实，这个策略描述的就是，股价下跌途中，价格有反弹迹象，同时高的换手，意味着，股票经常了多空的转换。而大概率是，由空到多。接下来，有利于，上涨趋势的延续。"},
        {type: "day", text: "2024.4-4"},
        {type: "note", text: "人拥有两只眼睛，一只眼睛聚焦当下，一只眼睛投向未来。两只眼睛的影像重叠，将影像传递给大脑。这也许就是，影像淡入淡出的最初灵感来源。"},
        {type: "note", text: "道氏理论核心，顺大逆小。"},
        {type: "note", text: "承接上条，其实也就是可以看出来。"},
        {type: "p", text: "一个股票是周线经常波动一次，还是月线波动一次。还是年线波动一次。周期品种就确定了。而周期品种的确定则是一件需要大量研究的事情。"},
        {type: "p", text: "就像农民播种到丰收，农作物本身是有周期的。这种自然的周期是经过不断经验的累积总结出来的。"},
        {type: "p", text: "假如，假设种麦子，就得半年。"},
        {type: "p", text: "而，买股票，如果半年线下跌中，就意味着这只股票目前来看不能拿半年，但月线上在走上升了。意味着，周线可以持有。"},
        {type: "p", text: "周线上 根据 道氏理论 低点不断下降，直至 大阴线一根破位 ；趋势发生反转。"},
        {type: "p", text: "但本质是，从日线观察，日线上(小趋势)已经提前发生下跌趋势。周线破位是迟早的事情。"},
        {type: "p", text: "联系到波浪理论，有条规定是，小周期不会穿越大周期。就是大周期上是下跌的，小周期里，多头实力不会太强，利空。"},
        {type: "p", text: "反之，大周期上行，空头实力不会太强，利多。"},
        {type: "p", text: "从上面这个案例可以推出，日线因为多头不强，导致了周线破位。"},
        {type: "note", text: "实战中："},
        {type: "sub", text: "1. 应该看周线，趋势，做日线交易。"},
        {type: "p", text: "如果周线空，日线要么就不做了。"},
        {type: "p", text: "周线空，有利于，日线交易者卖出股票比较准确。"},
        {type: "sub", text: "2. 周线趋势多，做日线交易多。卖出时间应该看，60分钟线。"},
        {type: "note", text: "合格的农民应该是最会炒股的人。因为他知道敬畏规律，敬畏周期。同时提前应对风险。"},
        {type: "img", src: "images/img2.webp"},
        {type: "note", text: "接个上条总结：核心就是，波浪理论的第三浪，绝对不是最小的波浪，来源于道氏理论。因为只有确定了，第三浪不是最小的波浪。"},
        {type: "sub", text: "1. 最长的波浪，会反馈给第一浪，两两加成，会让趋势延续。"},
        {type: "sub", text: "2. 和第一浪对等的波浪，还是会反馈给第一浪，两两加成，会让趋势延续。不过这种会比第一种，稍微概率低一点。"},
        {type: "sub", text: "3. 如果直接是最小的波浪，趋势就大概率会反转。趋势结构就不稳定了。出现了分歧。情况较为复杂。"},
        {type: "p", text: "所以，最稳定的波浪结构，或者说趋势结构，就是3浪结构。"},
        {type: "p", text: "也就是说"},
        {type: "sub", text: "1. 如果 一波下跌 趋势中 主要运动 衰竭 次波的反弹幅度和上一个次波运动对等，那么次波运动大概率变成 主要趋势运动；下跌趋势发生了 反转。"},
        {type: "sub", text: "2. 反之 如果 一波上涨趋势中 主要运动 衰竭 大概率次波运动 开始变 主要趋势 ；整个上涨趋势衰竭 转头向下概率加大。"},
        {type: "p", text: "总结来说 这和波浪理论及其相似 波浪理论中的 第三浪 绝对不会是 最小的波浪 其实某种程度上 是在讲，这波对趋势的关键性确定。"},
        {type: "note", text: "孤山寺北贾亭西，水面初平云脚低。"},
        {type: "p", text: "几处早莺争暖树，谁家新燕啄春泥。"},
        {type: "p", text: "乱花渐欲迷人眼，浅草才能没马蹄。"},
        {type: "p", text: "最爱湖东行不足，绿杨阴里白沙堤。"},
        {type: "p", text: "—趋势理论。"},
        {type: "note", text: "高低点的确认是，趋势反转的标准。"},
        {type: "day", text: "2024.4-2"},
        {type: "note", text: "承接上条，就是一旦事情发生，不要百分百肯定某件事，导致了结果。这不一定是原因。进而要重视，事情的发生，可能会导致的下一个未发生的结果。历史经验的作用在于，参考。"},
        {type: "p", text: "把因果，换成，正负反馈。例如，原始人野外被野兽攻击，险些丧命。"},
        {type: "p", text: "反馈的结果是，下次出门会带武器。"},
        {type: "p", text: "这个事件中，应该禁止使用，因为原始人被野兽攻击，所以下次出门带武器，也有可能带盔甲，也有可能还是不带任何东西。因为a，可能会导致b.c.d.e.f.g.这些都是结果。"},
        {type: "p", text: "而，如果用结果去推测原因，会是h.i.j.k.等等。"},
        {type: "note", text: "趋势交易者，大趋势反转进，60分钟级别小趋势走坏卖。"},

        {type: "p", text: "(巨鲸，有理由是一轮板块行情里全方面利好的承载者，大资金理应交易该只个股。)"},

  // ============ 分类 ============
  const categories = [
    { slug: "essay", name: "日常随笔" },
    { slug: "invest", name: "投资札记" }
  ];

  const home = document.getElementById("home");
  const article = document.getElementById("article");
  const categoryView = document.getElementById("category");
  const catalog = document.getElementById("catalog");
  const categoriesEl = document.getElementById("categories");
  const categoryCatalog = document.getElementById("category-catalog");

  function renderCatalog() {
    catalog.innerHTML = posts.map(p => `
      <li>
        <a class="post-link" href="#/post/${p.id}">
          <span class="title">${p.title}</span>
          <span class="dots"></span>
          <span class="date">${p.date}</span>
        </a>
      </li>
    `).join("");
  }

  function renderCategories() {
    categoriesEl.innerHTML = categories.map(c => {
      const n = posts.filter(p => p.category === c.slug).length;
      return `<a class="category-card" href="#/cat/${c.slug}">
        <span class="cat-name">${c.name}</span>
        <span class="cat-count">${n} 篇</span>
      </a>`;
    }).join("");
  }

  function renderCategoryPage(slug) {
    const c = categories.find(x => x.slug === slug) || categories[0];
    const list = posts.filter(p => p.category === c.slug);
    document.getElementById("category-title").textContent = c.name;
    document.getElementById("category-sub").textContent = "共 " + list.length + " 篇";
    categoryCatalog.innerHTML = list.map(p => `
      <li>
        <a class="post-link" href="#/post/${p.id}">
          <span class="title">${p.title}</span>
          <span class="dots"></span>
          <span class="date">${p.date}</span>
        </a>
      </li>
    `).join("");
    document.title = c.name + " · 南山怪客文集";
    window.scrollTo(0, 0);
  }

  function renderBlocks(blocks) {
    return blocks.map(b => {
      if (b.type === "h2") return `<h2 class="section">${b.text}</h2>`;
      if (b.type === "h3") return `<h3 class="sub">${b.text}</h3>`;
      if (b.type === "quote") return `<blockquote>${b.text}</blockquote>`;
      if (b.type === "list") return `<ul class="essay-list">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
      if (b.type === "day") return `<div class="day">${b.text}</div>`;
      if (b.type === "note") return `<p class="note">${b.text}</p>`;
      if (b.type === "sub") return `<p class="sub-note">${b.text}</p>`;
      if (b.type === "img") return `<figure class="figure"><img src="${b.src}" alt="" loading="lazy"></figure>`;
      return `<p class="body">${b.text}</p>`;
    }).join("");
  }

  function renderPost(id) {
    const p = posts.find(x => x.id === id) || posts[0];
    document.getElementById("article-title").textContent = p.title;
    document.getElementById("article-date").textContent = p.date;
    document.getElementById("article-lead").textContent = p.lead;
    document.getElementById("article-era").textContent = p.era;
    document.getElementById("article-body").innerHTML = renderBlocks(p.blocks);
    document.title = p.title + " · 南山怪客文集";
    window.scrollTo(0, 0);
  }

  function route() {
    const h = location.hash;
    if (h.startsWith("#/post/")) {
      renderPost(h.slice(7));
      article.classList.add("active");
      home.classList.remove("active");
      categoryView.classList.remove("active");
    } else if (h.startsWith("#/cat/")) {
      renderCategoryPage(h.slice(6));
      categoryView.classList.add("active");
      home.classList.remove("active");
      article.classList.remove("active");
    } else {
      document.title = "南山怪客 · 文集";
      article.classList.remove("active");
      categoryView.classList.remove("active");
      home.classList.add("active");
    }
  }

  renderCategories();
  renderCatalog();
  route();
  window.addEventListener("hashchange", route);
</script>
