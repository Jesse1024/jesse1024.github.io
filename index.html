<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南山怪客</title>
<script>if (/^#\//.test(location.hash)) location.replace("wenji.html" + location.hash);</script>
<!--
  南山怪客 · 图文电视首页 v2（真 3D 房间版）
  ------------------------------------------------------------------
  参照 felixrieseberg.com 的做法：整个房间是一个 three.js 3D 场景（内嵌在本文件里，离线可用）。
  - 桌子 / 墙 / 窗 / 台灯 / CRT / 键盘 / 茶杯 / 录像带 / 绿植 全是程序生成的 3D 模型，台灯带实时阴影；
  - 屏幕 = 2D canvas 画的图文电视信号 → CRT 着色器（桶形弯曲/扫描线/荫罩/色散/雪花）→ 贴在凸出的屏幕网格上；
  - 全部可点：屏幕上的每一行、机身 6 个按钮、旋钮、电源灯、桌上 4 盘录像带（按栏目筛选）、台灯（开关）、
    窗户（打雷）、键盘（按键会下沉，真键盘也会联动）；
  - 点击靠射线拾取，屏幕上的命中位置按「和着色器同一个弯曲函数」换算成字符行，所以边缘行也点得中。
  文章数据来自 https://jesse1024.github.io/ ；更新文章：改下面 POSTS。
-->
<style>
:root{--paper:#f4ecdc;--zhu:#a63a2b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#04050a;overflow:hidden;
  font-family:"Songti SC","SimSun",serif;color:#dfe3ea;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:0}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(85% 80% at 50% 48%,transparent 52%,rgba(0,0,0,.55) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#tip{position:fixed;z-index:40;pointer-events:none;padding:7px 10px;border-radius:3px;
  background:rgba(10,12,16,.92);border:1px solid rgba(255,255,255,.16);
  font:13px/1.5 "Songti SC","SimSun",serif;color:#eae4d6;max-width:340px;
  box-shadow:0 10px 26px rgba(0,0,0,.55);opacity:0;transition:opacity .12s}
#tip b{color:#ffd23f;font-weight:600}
#tip span{color:#8e9bb0}
.hud{position:fixed;z-index:30;display:flex;align-items:center;gap:22px;
  font:13px/1 "Songti SC","SimSun",serif;letter-spacing:.1em;color:#b9c2cf}
.hud.top{left:0;right:0;top:0;padding:20px 28px;background:linear-gradient(180deg,rgba(4,5,10,.86),transparent)}
.hud.top .name{font-size:17px;letter-spacing:.34em;color:#eae5d8}
.hud.top .sub{font-size:11px;letter-spacing:.28em;color:#7d8798;margin-left:-8px}
.hud.top nav{margin-left:auto;display:flex;gap:20px}
.hud button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:4px 2px;border-bottom:1px solid transparent}
.hud button:hover{color:#f0eadd;border-bottom-color:#8d6a3a}
.hud.bottom{left:0;right:0;bottom:0;padding:14px 28px;justify-content:space-between;
  background:linear-gradient(0deg,rgba(4,5,10,.9),transparent);font-size:12px;color:#8b95a5;pointer-events:none}
.hud.bottom .keys{display:flex;gap:16px;flex-wrap:wrap}
.hud kbd{font:11px/1 ui-monospace,monospace;padding:3px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.22);color:#cfd6e2}
#msg{position:fixed;z-index:35;left:50%;bottom:64px;transform:translateX(-50%);padding:8px 16px;border-radius:3px;
  background:rgba(8,10,14,.82);border:1px solid rgba(255,255,255,.12);font:13px/1.4 "Songti SC","SimSun",serif;
  letter-spacing:.14em;color:#e8dfc9;opacity:0;transition:opacity .25s;pointer-events:none}
#msg.on{opacity:1}
#reader{position:fixed;inset:0;z-index:50;display:none;overflow:auto;
  background:radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.5),transparent 60%),var(--paper);color:#241e14}
#reader.on{display:block}
#reader .wrap{max-width:760px;margin:0 auto;padding:76px 28px 120px}
#reader h1{font:700 30px/1.3 "Songti SC","SimSun",serif;letter-spacing:.16em;margin:0 0 6px}
#reader .sub{font:13px/1.9 "Songti SC",serif;color:#8a7d66;letter-spacing:.2em;margin-bottom:34px}
#reader ol{list-style:none;margin:0;padding:0;border-top:1px solid rgba(36,30,20,.16)}
#reader li{border-bottom:1px solid rgba(36,30,20,.12)}
#reader a{display:flex;gap:14px;align-items:baseline;padding:15px 2px;text-decoration:none;color:inherit}
#reader a:hover{background:rgba(166,58,43,.06)}
#reader .t{font:700 17px/1.5 "Songti SC",serif}
#reader a:hover .t{color:var(--zhu)}
#reader .d{margin-left:auto;font:12px/1.5 "Songti SC",serif;color:#8a7d66;white-space:nowrap}
#reader .c{font:11px/1.5 "Songti SC",serif;color:#a63a2b;border:1px solid rgba(166,58,43,.4);padding:2px 6px;border-radius:2px;white-space:nowrap}
#reader .back{position:fixed;right:26px;bottom:24px;padding:11px 18px;border:1px solid #a63a2b;color:#a63a2b;background:var(--paper);
  font:13px/1 "Songti SC",serif;letter-spacing:.2em;cursor:pointer}
#reader .back:hover{background:#a63a2b;color:var(--paper)}
#reader .seal{width:64px;height:64px;margin:56px auto 0;border:2px solid rgba(166,58,43,.55);border-radius:3px;display:grid;place-items:center;
  color:rgba(166,58,43,.85);font:700 13px/1.15 "Songti SC",serif;letter-spacing:.05em;text-align:center}
@media (max-width:600px){
  .hud.top{flex-wrap:wrap;padding:12px 14px 22px;gap:6px 12px}
  .hud.top .name{font-size:16px}
  .hud.top nav{margin-left:0;width:100%;justify-content:space-between;gap:6px;font-size:13px}
  .hud button{white-space:nowrap;padding:8px 4px}
  #reader .wrap{padding:64px 18px 110px}
  #reader li a{flex-wrap:wrap;gap:4px 10px}
  #reader .d{margin-left:0}
}
@media (max-width:900px){
  .hud.top{padding:16px 18px;gap:14px}
  .hud.top nav{gap:12px;font-size:12px}
  .hud.top .sub{display:none}
  .hud.bottom{display:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="书桌：桌上的老式显示器里是文章目录，点屏幕上的一行即可阅读"></canvas>
<div id="vig"></div><div id="grain"></div>

<header class="hud top">
  <span class="name">南山怪客</span>
  <nav>
    <button type="button" id="btn-zoom">放大屏幕</button>
    <button type="button" id="btn-reader">阅读版</button>
    <button type="button" id="btn-random">随便一篇</button>
    <button type="button" id="btn-lamp">台灯 开</button>
    <button type="button" id="btn-sound" aria-pressed="false">声音 音效</button>
  </nav>
</header>
<footer class="hud bottom">
  <div class="keys">
    <span>点屏幕上的一行即可阅读</span>
    <span><kbd>Z</kbd> 放大/缩小</span>
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
    <span><kbd>Enter</kbd> 打开</span>
    <span><kbd>←</kbd><kbd>→</kbd> 翻页</span>
    <span><kbd>1</kbd>–<kbd>6</kbd> 机身按钮</span>
    <span><kbd>L</kbd> 台灯</span>
    <span><kbd>Esc</kbd> 阅读版</span>
  </div>
  <div id="clock">—</div>
</footer>
<div id="tip" role="status"></div>
<div id="msg"></div>
<div id="live" class="sr" aria-live="polite"></div>
<nav id="a11y" class="sr" aria-label="文章目录（文字版）"></nav>

<section id="reader" aria-label="阅读版：文章目录">
  <div class="wrap">
    <h1>文章目录</h1>
    <div class="sub">共 <span id="rcount">0</span> 篇</div>
    <ol id="rlist"></ol>
    <div style="margin-top:28px"><a href="wenji.html"><span class="t">进入文集 · 按栏目浏览 →</span></a></div>
  </div>
  <button type="button" class="back" id="btn-back">回到书桌</button>
</section>

var LAT = 0.58;
function fit(s, maxCells){
  var out = "", n = 0;
  for (var i = 0; i < s.length; i++){
    var w = RE_WIDE.test(s[i]) ? 2 : LAT;
    if (n + w > maxCells - 2) return out + "…";
    out += s[i]; n += w;
  }
  return out;
}

var FONT = '"SimSun","Songti SC","Noto Serif CJK SC","Noto Sans SC",serif';
var MONO = "Consolas,'Courier New',monospace";
var _cw = {};
function charW(ch, size, wide){
  var key = size + ch, v = _cw[key];
  if (v === undefined){
    var fs = size * KS;
    S.font = wide ? ("700 " + fs.toFixed(1) + "px " + FONT) : ("600 " + (fs * 0.9).toFixed(1) + "px " + MONO);
    v = S.measureText(ch).width; _cw[key] = v;
  }
  return v;
}
function measure(str, size){
  var w = 0;
  for (var i = 0; i < str.length; i++){ var wide = RE_WIDE.test(str[i]); w += charW(str[i], size, wide) + (wide ? 1.4 : 0.5); }
  return w;
}
function drawChars(str, x, y, size){
  var cx = x;
  for (var i = 0; i < str.length; i++){
    var ch = str[i], wide = RE_WIDE.test(ch), fs = size * KS;
    S.font = wide ? ("700 " + fs.toFixed(1) + "px " + FONT) : ("600 " + (fs * 0.9).toFixed(1) + "px " + MONO);
    S.fillText(ch, cx, y);
    cx += charW(ch, size, wide) + (wide ? 1.4 : 0.5);
  }
}
function put(col, row, str, color, opt){
  opt = opt || {};
  var size = opt.size || 26, x = col * CW, y = row * RH;
  S.fillStyle = color || FG.white;
  if (opt.dbl){
    S.save(); S.translate(x, y + RH * 2 - 8); S.scale(1, 1.92); drawChars(str, 0, 0, size); S.restore();
  } else drawChars(str, x + 1, y + RH - 4, size);
}
function putRight(endCol, row, str, color, opt){
  opt = opt || {};
  var size = opt.size || 26;
  S.fillStyle = color || FG.white;
  drawChars(str, endCol * CW - measure(str, size) - 2, row * RH + RH - 4, size);
}

/* 着色器和拾取共用同一个弯曲函数 —— 这是上一版「边缘点不中」的根因 */
var VISX = 0.95, VISY = 0.963;   // 屏幕网格比塑料开口略大，可见部分 = 中间这一块，正好对应整张画布
var WARP_PRE = 0.93, WARP_A = 0.06, WARP_B = 0.02;
function warpTex(u, v){
  u = (u - .5) / VISX + .5; v = (v - .5) / VISY + .5;
  var px = (u*2-1) * WARP_PRE, py = (v*2-1) * WARP_PRE;
  var r2 = px*px + py*py, k = 1 + WARP_A*r2 + WARP_B*r2*r2;
  return [px*k*0.5+0.5, py*k*0.5+0.5];
}
function hitTeletext(uvx, uvy){   // uv: 屏幕网格 uv（y 向上）
  var t = warpTex(uvx, uvy);
  if (t[0] < 0 || t[0] > 1 || t[1] < 0 || t[1] > 1) return null;
  var col = t[0] * COLS, row = (1 - t[1]) * ROWS, r = Math.floor(row);
  if (r >= POST_ROW0 && r < POST_ROW0 + PER * POST_STEP){
    var i = Math.floor((r - POST_ROW0) / POST_STEP), j = page * PER + i;
    if (i < PER && view[j]) return {kind:"post", index:j};
  }
  if (r === FASTEXT_ROW || r === FASTEXT_ROW + 1){   // 色块键两行高
    var k = Math.floor((col - 1) / 10);
    if (k >= 0 && k < 4 && (col - 1) - k*10 < 9.2) return {kind:"key", key:k};
  }
  return null;
}

function cv(w, h){ var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function tex(c, srgb){
  var t = new THREE.CanvasTexture(c);
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function noiseCanvas(w, h, base, amp, streak){
  var c = cv(w, h), g = c.getContext("2d");
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  var id = g.getImageData(0, 0, w, h), d = id.data;
  for (var i = 0; i < d.length; i += 4){
    var n = (Math.random() - .5) * amp;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  g.putImageData(id, 0, 0);
  if (streak){
    for (var k = 0; k < streak; k++){
      g.fillStyle = "rgba(0,0,0," + (Math.random()*.05).toFixed(3) + ")";
      g.fillRect(0, Math.random()*h, w, 1 + Math.random()*2);
    }
  }
  return c;
}
function mat(color, rough, metal, extra){
  var o = {color:color, roughness:rough == null ? .6 : rough, metalness:metal || 0};
  if (extra) for (var k in extra) o[k] = extra[k];

}
function shadowed(m, cast, recv){

}
function addMesh(parent, geo, material, x, y, z){

}
function rrPath(p, x, y, w, h, r){
  p.moveTo(x + r, y); p.lineTo(x + w - r, y); p.quadraticCurveTo(x + w, y, x + w, y + r);
  p.lineTo(x + w, y + h - r); p.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  p.lineTo(x + r, y + h); p.quadraticCurveTo(x, y + h, x, y + h - r);
  p.lineTo(x, y + r); p.quadraticCurveTo(x, y, x + r, y);

function rrGeo(w, h, r, depth, bevel, hole){
  var s = new THREE.Shape(); rrPath(s, -w/2, -h/2, w, h, r);
  if (hole){ var hp = new THREE.Path(); rrPath(hp, hole.x - hole.w/2, hole.y - hole.h/2, hole.w, hole.h, hole.r); s.holes.push(hp); }

function limb(parent, p0, p1, r, material){
  var a = new THREE.Vector3(p0[0], p0[1], p0[2]), b = new THREE.Vector3(p1[0], p1[1], p1[2]);

var FRAG = [
"precision highp float;",
"uniform sampler2D uTex; uniform float uTime,uPower,uGlitch,uBright,uNoise;",
"varying vec2 vUv;",
"vec2 warp(vec2 uv){ vec2 p=(uv*2.0-1.0)*0.93; float r2=dot(p,p); p*=1.0+0.06*r2+0.02*r2*r2; return p*0.5+0.5; }",
"float hs(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }",
"void main(){",
"  float pv=max(uPower,0.0016);",
"  float ph=mix(0.05,1.0,smoothstep(0.0,0.45,uPower));",
"  vec2 q=(vUv-0.5)/vec2(ph,pv)+0.5;",
"  float inside=step(abs(vUv.y-0.5),pv*0.5)*step(abs(vUv.x-0.5),ph*0.5);",
"  q=(q-0.5)/vec2(0.95,0.963)+0.5;",
"  vec2 uv=warp(q);",
"  uv=clamp(uv,vec2(0.0005),vec2(0.9995));",
"  float inTex=step(0.0,uv.x)*step(uv.x,1.0)*step(0.0,uv.y)*step(uv.y,1.0);",
"  float g=uGlitch;",
"  float rowId=floor(uv.y*30.0);",
"  float band=step(0.62,hs(vec2(rowId,floor(uTime*13.0))))*g;",
"  uv.x+=band*(hs(vec2(rowId,3.3))-0.5)*0.10;",
"  uv.x+=(hs(vec2(floor(uv.y*240.0),floor(uTime*40.0)))-0.5)*0.0016*(1.0+g*8.0);",
"  float ca=0.0011+0.010*g;",
"  vec3 c;",
"  c.r=texture2D(uTex,uv+vec2(ca,0.0)).r;",
"  c.g=texture2D(uTex,uv).g;",
"  c.b=texture2D(uTex,uv-vec2(ca,0.0)).b;",
"  vec2 px=vec2(1.8/1536.0,1.8/1152.0);",
"  vec3 quad=(texture2D(uTex,uv+vec2(px.x,px.y)).rgb+texture2D(uTex,uv+vec2(-px.x,px.y)).rgb+texture2D(uTex,uv+vec2(px.x,-px.y)).rgb+texture2D(uTex,uv+vec2(-px.x,-px.y)).rgb)*0.25;",
"  c=mix(c,quad,0.5);",
"  vec3 glow=(texture2D(uTex,uv+vec2(0.006,0.0)).rgb+texture2D(uTex,uv-vec2(0.006,0.0)).rgb+texture2D(uTex,uv+vec2(0.0,0.008)).rgb+texture2D(uTex,uv-vec2(0.0,0.008)).rgb)*0.25;",
"  c+=glow*0.22;",
"  float ly=vUv.y*480.0; float fw=fwidth(ly);",
"  float fade=1.0-smoothstep(0.35,0.95,fw);",
"  float sl=0.5+0.5*cos(ly*6.2831853);",
"  c*=mix(1.0,0.74+0.26*sl,fade);",
"  float lx=vUv.x*1080.0; float fx=fwidth(lx);",
"  float fadeX=1.0-smoothstep(0.5,1.2,fx);",
"  vec3 grille=0.93+0.07*sin(vec3(0.0,2.094,4.188)+lx*2.094);",
"  c*=mix(vec3(1.0),grille,fadeX);",
"  float n=hs(vUv*vec2(900.0,700.0)+fract(uTime)*137.0);",
"  c+=(n-0.5)*(0.03*uNoise+0.32*g);",
"  c*=0.975+0.025*sin(uTime*11.0);",
"  c*=1.0-0.08*exp(-pow((vUv.y-(1.0-fract(uTime*0.09)))*9.0,2.0));",
"  vec2 e=vUv-0.5;",
"  c*=1.0-0.55*dot(e,e);",
"  c=c+vec3(0.006,0.010,0.018);",
"  c*=inside*smoothstep(0.002,0.03,uPower);",
"  c+=vec3(0.9,0.95,1.0)*(1.0-smoothstep(0.0,0.05,uPower))*inside*smoothstep(0.002,0.03,uPower);",
"  c*=1.6*uBright;",
"  gl_FragColor=vec4(pow(max(c,0.0),vec3(0.9)),1.0);",
"}"
].join("\n");

function buildClock(){
  var C = new THREE.Group(); C.position.set(42, 0, 31); C.rotation.y = -.34; scene.add(C);

  }
  dx.fillStyle = "#2a241a"; dx.font = "700 54px Georgia,'Songti SC',serif"; dx.textAlign = "center"; dx.textBaseline = "middle";
  for (var n = 1; n <= 12; n++){ var an = n / 12 * Math.PI * 2; dx.fillText(String(n), 256 + Math.sin(an) * 160, 256 - Math.cos(an) * 160 + 3); }
  var dial = new THREE.Mesh(new THREE.CircleGeometry(R - .75, 64), new THREE.MeshStandardMaterial({map:tex(dc), emissiveMap:tex(dc), emissive:0x3a3630, roughness:.7}));
  dial.position.z = 2.12; dial.receiveShadow = true; body.add(dial);
  // 指针

    m.position.y = (len - (tail || 0)) / 2; g.add(m); body.add(g); return g;
  }
  var alarmH = hand(2.6, .3, 0xb98a2c, 2.18); alarmH.rotation.z = -Math.PI * 2 * (7 / 12);
  var hH = hand(3.2, .55, 0x1c1812, 2.24), mH = hand(4.7, .38, 0x1c1812, 2.3), sH = hand(5.2, .14, 0xb3261e, 2.36, 1.2);
  var cap = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .3, 20), brass); cap.rotation.x = Math.PI/2; cap.position.z = 2.45; body.add(cap);

  var gg = gx.createLinearGradient(0, 0, 256, 256); gg.addColorStop(0, "rgba(255,255,255,.35)"); gg.addColorStop(.4, "rgba(255,255,255,.04)"); gg.addColorStop(1, "rgba(255,255,255,0)");

  gl.position.z = 2.55; gl.raycast = function(){}; body.add(gl);
  // 铃与锤
  var bells = [];

    var pv = new THREE.Group(); pv.position.set(sd * R * Math.sin(.72), R * Math.cos(.72) + .2, 0); pv.rotation.z = -sd * .72; body.add(pv);
    var dome = new THREE.Mesh(new THREE.SphereGeometry(2.7, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({color:0xd2ae62, roughness:.28, metalness:.9, side:THREE.DoubleSide}));
    dome.position.y = .1; shadowed(dome); pv.add(dome);
    var knob = new THREE.Mesh(new THREE.SphereGeometry(.4, 12, 8), brass); knob.position.y = 2.75; pv.add(knob);

  });
  var hammer = new THREE.Group(); hammer.position.set(0, R + .9, 0); body.add(hammer);
  var rod = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 3.4, 8), brass); rod.position.y = 1.7; hammer.add(rod);
  var ball = new THREE.Mesh(new THREE.SphereGeometry(.5, 14, 10), brass); ball.position.y = 3.5; shadowed(ball); hammer.add(ball);
  // 小脚
  [-1, 1].forEach(function(sd){
    var ft = new THREE.Mesh(new THREE.CylinderGeometry(.3, .8, 1.4, 12), brass); ft.position.set(sd * 4.2, .7, -.4); ft.rotation.z = sd * .35; shadowed(ft); C.add(ft);
  });
  tag(C, "clock", null, "<b>闹钟</b><br><span>走的是你电脑的当前时间 · 点一下：响铃</span>");
  var ring = 0, lastSec = -1;
  S3.clockRing = function(){ ring = 1.5; };
  animators.push(function(dt, t){
    var d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000, m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    var si = Math.floor(s), fr = s - si, step = si + Math.min(1, fr * 9) * (1 + Math.sin(Math.min(1, fr * 9) * Math.PI) * .08);
    sH.rotation.z = -step / 60 * Math.PI * 2;
    mH.rotation.z = -(d.getMinutes() + si / 60) / 60 * Math.PI * 2;
    hH.rotation.z = -h / 12 * Math.PI * 2;
    if (si !== lastSec){ lastSec = si; if (S3.soundOn && AC && ring <= 0){ var tt = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = "square"; o.frequency.value = 2400 + (si % 2) * 160; g.gain.setValueAtTime(.012, tt); g.gain.exponentialRampToValueAtTime(.0001, tt + .018); o.connect(g); g.connect(AC.destination); o.start(tt); o.stop(tt + .02); } }
    if (ring > 0){
      ring -= dt;
      var sh = Math.sin(t * 90) * .07 * Math.min(1, ring * 3);
      bells.forEach(function(b){ b.g.rotation.z = b.base + sh * b.sd; });
      hammer.rotation.z = Math.sin(t * 90) * .22 * Math.min(1, ring * 3);
      C.rotation.z = Math.sin(t * 90) * .008 * Math.min(1, ring * 3);
    } else {
      bells.forEach(function(b){ b.g.rotation.z = b.base; }); hammer.rotation.z = 0; C.rotation.z = 0;
    }
  });
}
function clockRing(){

  }

function buildDust(){
  var n = 90, pos = new Float32Array(n*3), seed = [];
  for (var i = 0; i < n; i++){
    seed.push({x:Math.random()*60 - 8, y:Math.random()*40 + 2, z:Math.random()*50 - 20, s:Math.random()*6.3});
    pos[i*3] = seed[i].x; pos[i*3+1] = seed[i].y; pos[i*3+2] = seed[i].z;
  }
  var geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  var c = cv(32, 32), cx = c.getContext("2d"), gr = cx.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, "rgba(255,225,180,1)"); gr.addColorStop(1, "rgba(255,225,180,0)"); cx.fillStyle = gr; cx.fillRect(0, 0, 32, 32);
  var pts = new THREE.Points(geo, new THREE.PointsMaterial({map:new THREE.CanvasTexture(c), size:.7, transparent:true, opacity:.5, depthWrite:false, blending:THREE.AdditiveBlending, toneMapped:false}));
  pts.raycast = function(){}; scene.add(pts);
  animators.push(function(dt, t){
    var a = geo.attributes.position;
    for (var i = 0; i < n; i++){
      var s = seed[i];
      a.setXYZ(i, s.x + Math.sin(t*.12 + s.s)*4, s.y + Math.sin(t*.09 + s.s*2)*3, s.z + Math.cos(t*.1 + s.s)*3);
    }
    a.needsUpdate = true; pts.material.opacity = .15 + .4 * S3.lampLevel;
  });
}

var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), pointer = {x:0, y:0, in:false, moved:false, mouse:false};
var tip = document.getElementById("tip"), live = document.getElementById("live"), msg = document.getElementById("msg");
var KEY_ACT = ["prev","next","random","reader","sound","power"];
var msgTimer = 0;
function say(text){
  msg.textContent = text; msg.classList.add("on");
  clearTimeout(msgTimer); msgTimer = setTimeout(function(){ msg.classList.remove("on"); }, 1700);
}
function rootOf(o){ while (o && !o.userData.act) o = o.parent; return o; }

function pick(){
  ndc.set(pointer.x / window.innerWidth * 2 - 1, -(pointer.y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  var hits = raycaster.intersectObjects(scene.children, true);
  for (var i = 0; i < hits.length; i++){
    var h = hits[i];
    if (h.object.type === "Sprite" || h.object.type === "Points") continue;
    var r = rootOf(h.object);
    return {hit:h, root:r};
  }
  return null;
}

function applyHover(res){
  var root = res && res.root || null, tele = null;
  if (root && root.userData.isScreen){
    tele = hitTeletext(res.hit.uv.x, res.hit.uv.y);
    if (!tele) root = null;
  }
  var idx = (tele && tele.kind === "post") ? tele.index : -1;
  if (idx !== hoverIdx){ hoverIdx = idx; dirty = true; }
  // 高亮
  if (S3.hoverObj && S3.hoverObj !== root && S3.hoverObj.material && S3.hoverObj.material.emissive && !S3.hoverObj.userData.isScreen){
    S3.hoverObj.material.emissive.setHex(0x000000);
  }
  S3.hoverObj = root;
  if (root && root.material && root.material.emissive && root.userData.act !== "tape" && !root.userData.isScreen && root !== S3.led) root.material.emissive.setHex(0x3a3220);
  // 提示
  var html = "";
  if (tele && tele.kind === "post"){
    var p = view[tele.index];
    html = "<b>" + p.title + "</b><br><span>" + p.date + " · " + CATS[p.cat].n + " · 点击阅读</span>";
  } else if (tele && tele.kind === "key"){
    html = "<b>" + ["上一页","下一页","随便一篇","阅读版"][tele.key] + "</b>";
  } else if (root && root.userData.tip && !root.userData.isScreen){
    html = root.userData.tip;
  }

  document.getElementById("rcount").textContent = POSTS.length;
  document.getElementById("btn-reader").addEventListener("click", function(){ showReader(true); });
  document.getElementById("btn-back").addEventListener("click", function(){ showReader(false); });
  document.getElementById("btn-random").addEventListener("click", function(){ if (renderer) doAction("random"); else openPost(Math.floor(Math.random()*POSTS.length), true); });
  document.getElementById("btn-sound").addEventListener("click", function(){ toggleSound(); });
  document.getElementById("btn-zoom").addEventListener("click", function(){ toggleZoom(); });
  document.getElementById("btn-lamp").addEventListener("click", function(){ toggleLamp(); });
  function clk(){
    var d = new Date();
    document.getElementById("clock").textContent = d.getFullYear() + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + ("0"+d.getDate()).slice(-2) +
      "  " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2) + ":" + ("0"+d.getSeconds()).slice(-2);
  }
  clk(); setInterval(clk, 1000);
})();

if (renderer){ build(); boot(); }
window.__nsk = {S3:S3, cam:cam, doAction:doAction, scene:scene, camera:camera};
})();
</script>
